  };
}

async function runAutoTest(){
  const report={ok:false, steps:[], controls:{portrait:null, landscape:null}, visual:null, terrainAir:[], fail:[]};
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  function pass(name, cond, detail){
    report.steps.push({name, ok:!!cond, detail});
    if(!cond) report.fail.push(name);
  }
  report.controls.portrait=controlsVisibleReport();

  reset(); S._auto=true;
  for(const b of S.boulders) b.hit=true;
  input.throtPointers.clear(); input._keyThrottle=true; syncThrottle();
  input.trick=false;
  const x0=S.p.x;
  let guard=0;
  while(guard++<180){ step(0.016); }
  pass('throttle_climb', S.p.x > x0+80 && S.p.vx>160 && !input.trick, {x:S.p.x, dx:S.p.x-x0, vx:S.p.vx, on:S.p.on});

  reset(); S._auto=true; S.p.vx=200;
  doGroundPop();
  pass('tap_pop', !S.p.on && S.p.vy<0, {on:S.p.on, vy:S.p.vy});

  reset(); S._auto=true;
  S.p.x=340; S.p.on=false; S.p.y=groundY(340)-50; S.p.vy=-40; S.p.vx=220;
  S.airTime=0.15; S.launchAmp=34; S.bigAirLatch=false; resetMeter();
  doAirTapTrick();
  pass('small_no_meter', !S.meter.active, {meter:S.meter});
  for(let i=0;i<90 && !S.p.on;i++) step(0.016);
  pass('tap_trick_clean', S.p.on && S.tricksLanded>=1 && !S.crashed, {
    on:S.p.on, tricks:S.tricksLanded, crashed:S.crashed, score:S.score
  });

  reset(); S._auto=true;
  const bigLip=LIPS.find(L=>L[2]>=BIG_AIR_AMP);
  S.p.x=bigLip[0]+bigLip[1]*0.55;
  S.p.on=false; S.p.y=groundY(S.p.x)-110; S.p.vy=-60; S.p.vx=260;
  S.airTime=0.5; S.launchAmp=bigLip[2]; S.bigAirLatch=true;
  input.trick=true; input.trickDownAt=performance.now()-300; input.trickWasHold=true;
  beginAirTrickHold();
  S.meter.level=0.75; // inside gold/green (zones retuned)
  releaseMeter(400, true);
  input.trick=false; trickEl.classList.remove('on'); // finger up
  pass('green_release_commit', S.meter.committed && (S.meter.stick==='clean'||S.meter.stick==='perfect'), {meter:Object.assign({},S.meter)});
  for(let i=0;i<100 && !S.p.on;i++) step(0.016);
  pass('green_lands', S.p.on && S.tricksLanded>=1 && !S.crashed, {
    tricks:S.tricksLanded, crashed:S.crashed, score:S.score
  });

  reset(); S._auto=true;
  S.p.x=bigLip[0]+bigLip[1]*0.5;
  S.p.on=false; S.p.y=groundY(S.p.x)-100; S.p.vy=-40; S.p.vx=240;
  S.airTime=0.5; S.launchAmp=bigLip[2]; S.bigAirLatch=true;
  draw();
  report.terrainAir.push(terrainOnScreenCheck());

  reset(); S._auto=true;
  S.p.x=bigLip[0]+bigLip[1]*0.55;
  S.p.on=false; S.p.y=groundY(S.p.x)-110; S.p.vy=-60; S.p.vx=260;
  S.airTime=0.5; S.launchAmp=bigLip[2]; S.bigAirLatch=true;
  input.trick=true; input.trickDownAt=performance.now()-500; input.trickWasHold=true;
  beginAirTrickHold();
  S.meter.level=0.96; // past green
  releaseMeter(600, true);
  input.trick=false; trickEl.classList.remove('on');
  for(let i=0;i<100 && !S.p.on;i++) step(0.016);
  pass('late_release_crash', S.crashed===true || S.p.lives<4, {
    crashed:S.crashed, lives:S.p.lives, stick:S.meter&&S.meter.stick
  });

  reset(); S._auto=true;
  S.p.x=340; S.p.on=false; S.p.y=groundY(340)-40; S.p.vy=-20; S.p.vx=180;
  S.airTime=0.12; S.launchAmp=34; S.bigAirLatch=false; resetMeter();
  input.trick=true; input.trickDownAt=performance.now()-250; input.trickWasHold=true;
  beginAirTrickHold();
  pass('meter_never_small', !S.meter.active, {meter:Object.assign({},S.meter), big:isBigAirEligible()});

  reset(); S._auto=true;
  for(const b of S.boulders) b.hit=true;
  input._keyThrottle=true; syncThrottle();
  guard=0; let lipI=0;
  const lips=LIPS.map(L=>({x:L[0], amp:L[2]}));
  while(!S.finished && guard++<5000){
    if(lipI<lips.length && S.p.x >= lips[lipI].x-30){
      const L=lips[lipI];
      S.p.x=L.x+40; S.p.on=false; S.p.y=groundY(S.p.x)-(L.amp>=BIG_AIR_AMP?110:55);
      S.p.vy=-50; S.p.vx=280; S.airTime=L.amp>=BIG_AIR_AMP?0.5:0.15;
      S.launchAmp=L.amp; S.bigAirLatch=L.amp>=BIG_AIR_AMP; resetMeter();
      if(L.amp>=BIG_AIR_AMP){
        input.trick=true; beginAirTrickHold();
        S.meter.level=0.73; releaseMeter(350,true);
      } else {
        doAirTapTrick();
      }
      draw();
      if(L.amp>=BIG_AIR_AMP) report.terrainAir.push(terrainOnScreenCheck());
      await wait(30);
      S.p.y=groundY(S.p.x)+1; S.p.vy=40; step(0.016);
      lipI++;
      await wait(20);
    }
    if(S.p.vx<120) S.p.vx=280;
    if(lipI>=lips.length){
      S.p.on=true; S.p.vx=Math.max(S.p.vx, 360);
      S.p.x += 28; S.p.y=groundY(S.p.x); S.p.ang=slopeAt(S.p.x);
    }
    if(S.p.x > LEVEL_LEN-80){ S.p.x=LEVEL_LEN+1; }
    step(0.016);
    await wait(8);
  }

  report.controls.portrait = report.controls.portrait || controlsVisibleReport();
  if(window.__BC_CTRL_LANDSCAPE) report.controls.landscape=window.__BC_CTRL_LANDSCAPE;
  else report.controls.landscape=controlsVisibleReport();

  draw();
  report.visual=visualClearCheck();
  report.terrainAirOk = report.terrainAir.length>0 && report.terrainAir.every(t=>t.ok);

  const pineSnap = (S.pines||[]).map(pn=>({x:pn.x, onFeature:onFeatureSpan(pn.x)}));
  const pineFollowFail = pineSnap.some(pn=>Math.abs(pn.x - (S.p.x+160))<1);
  const pineFeatureFail = pineSnap.some(pn=>pn.onFeature);
  const pineWorldOk = pineSnap.length>0 && !pineFollowFail && !pineFeatureFail;
  const pineStart = window.__BC_PINES || [];
  const pineStable = pineStart.length===pineSnap.length &&
    pineStart.every((pn,i)=>Math.abs(pn.x - pineSnap[i].x)<0.01);
  report.pines={ok:pineWorldOk&&pineStable, followFail:pineFollowFail, featureFail:pineFeatureFail,
    stable:pineStable, list:pineSnap};

  report.cardHud = {portrait:null, landscape:null};
  function freezeCrashCardCheck(testW, testH){
    W=testW; H=testH;
    cv.width=(W*DPR)|0; cv.height=(H*DPR)|0;
    cx.setTransform(DPR,0,0,DPR,0,0);
    camSmoothY=null; scorePops=[];
    reset(); S._auto=true;
    applyCrashPose(S.p);
    midFlash('UNDER-ROTATED', null, false);
    computeCam(S.p); draw();
    return assertCardClearsHud();
  }
  const savedW=W, savedH=H;
  report.cardHud.portrait = freezeCrashCardCheck(390, 844);
  pass('card_clears_hud_portrait', report.cardHud.portrait.ok, report.cardHud.portrait);
  report.cardHud.landscape = freezeCrashCardCheck(844, 390);
  pass('card_clears_hud_landscape', report.cardHud.landscape.ok, report.cardHud.landscape);
  W=savedW; H=savedH; resize();

  const failOk = report.fail.length===0;
  const cOk = report.controls.portrait.ok && (report.controls.landscape?report.controls.landscape.ok:true);
  const cardOk = report.cardHud.portrait.ok && report.cardHud.landscape.ok;
  const bigLips = LIPS.filter(L=>L[2]>=BIG_AIR_AMP).length;
  report.bigLips=bigLips;
  report.ok = !!(failOk && S.won && S.jumpsLanded>=3 && S.tricksLanded>=2 && cOk && report.visual.ok
    && report.terrainAirOk && report.pines.ok && bigLips>=3 && cardOk);
  report.jumpsLanded=S.jumpsLanded; report.tricksLanded=S.tricksLanded;
  report.score=S.score; report.won=S.won; report.height=S.height;
  report.CAM_ROT=CAM_ROT; report.HUMAN_H_FRAC=HUMAN_H_FRAC;
  window.__BC_TEST=report;
  console.log('BC_AUTO_TEST', JSON.stringify(report));
  return report;
}
window.__BC_controlsVisibleReport=controlsVisibleReport;
window.__BC_assertCardClearsHud=assertCardClearsHud;

function applyShotFreeze(){
  if(!SHOT||!S) return;
  camSmoothY=null;
  scorePops=[];
  const bigLip=LIPS.find(L=>L[2]>=BIG_AIR_AMP) || LIPS[1];
  const hideHints=()=>{
    if(throtHintEl) throtHintEl.classList.add('hide');
  };
  BG.key = resolveBgKey();
  if(SHOT==='climb' || SHOT==='controls'){
    // Seat sled just uphill of the first rock so a boulder reads near the skis
    S.p.on=true; S.p.x=360; S.p.y=groundY(360); S.p.ang=slopeAt(360);
    S.p.vx=220; S.p.charge=0.85;
    S.lean=-0.12; S.bob=1.4; S.throtGlow=0; // no stray green edge on plate QA shots
    input._keyThrottle=false; syncThrottle();
    S.throtHeld=3.1; tipsAfterFirstRun=false;
    hideHints();
  } else if(SHOT==='pop'){
    hideHints();
    S.p.on=false; S.p.x=380; S.p.y=groundY(380)-56; S.p.vy=-200; S.p.ang=slopeAt(380)-0.25;
    S.airTime=0.12; S.launchAmp=34; S.bigAirLatch=false; resetMeter();
    S.lean=-0.08; S.tuck=0.06; midFlash('POP', null, false);
  } else if(SHOT==='meter' || SHOT==='air' || SHOT==='airland'){
    hideHints();
    S.throtHeld=3.1;
    S.p.on=false; S.p.x=bigLip[0]+bigLip[1]*0.5;
    S.p.y=groundY(S.p.x)-118; S.p.vy=-120; S.p.ang=-0.55;
    S.airTime=0.55; S.launchAmp=bigLip[2]; S.bigAirLatch=true;
    S.p.trick=TRICKS[4]; S.p.spinAcc=-Math.PI; S.chainCount=2; S.chainLabs=['BACKFLIP','BARREL ROLL'];
    S.meter={active:true, level:0.58, holding:true, committed:false, stick:null, crash:false};
    S.score=420; S.p.charge=0.72;
    S.lean=-0.18; S.tuck=0.14;
  } else if(SHOT==='green'){
    hideHints();
    S.p.on=false; S.p.x=bigLip[0]+bigLip[1]*0.55;
    S.p.y=groundY(S.p.x)-100; S.p.vy=-40; S.p.ang=-0.2;
    S.airTime=0.7; S.launchAmp=bigLip[2]; S.bigAirLatch=true;
    S.p.trick=TRICKS[4]; S.chainLabs=['BACKFLIP']; S.chainCount=1;
    S.meter={active:true, level:0.75, holding:false, committed:true, stick:'perfect', crash:false};
    S.score=640; S.tuck=0.12;
  } else if(SHOT==='landed' || SHOT==='land'){
    hideHints();
    S.p.on=true; S.p.x=bigLip[0]+bigLip[1]+40; S.p.y=groundY(S.p.x); S.p.ang=slopeAt(S.p.x);
    S.landFlash=0.35; S.compress=0.9; S.jumpsLanded=3; S.tricksLanded=2; S.score=860;
    S.p.charge=0.68; S.lean=0.06; resetMeter();
    scorePopup('BACKFLIP', 416, true);
  } else if(SHOT==='crash'){
    hideHints();
    let cxCrash=bigLip[0]+bigLip[1]+120;
    const blocked=(x)=>
      (S.pines||[]).some(pn=>Math.abs(pn.x-x)<90) ||
      (S.boulders||[]).some(b=>!b.hit && Math.abs(b.x-x)<55);
    let best=cxCrash, bestScore=1e9;
    for(let k=0;k<16;k++){
      const x=cxCrash + k*36;
      if(blocked(x)) continue;
      const sc=Math.abs(slopeAt(x));
      if(sc<bestScore){ bestScore=sc; best=x; }
      if(sc<0.25) break;
    }
    S.p.x=best; S.p.vx=60; S.p.lives=3; S.landFlash=0.18;
    applyCrashPose(S.p);
    resetMeter();
    midFlash('UNDER-ROTATED', null, false);
  } else if(SHOT==='pine'){
    hideHints();
    S.p.x=400; S.p.y=groundY(400); S.p.ang=slopeAt(400); S.p.charge=0.9;
  } else if(SHOT==='rocks'){
    hideHints();
    S.pines = [];
    const rA=32, rC=28, pairGap=150;
    let bestX=null, bestScore=1e9;
    for(let x=300;x<Math.min(LEVEL_LEN-220, 2100);x+=6){
      const a=x, c=x+pairGap, m=x+pairGap*0.5;
      if(rockSpansCrest(a, rA) || rockSpansCrest(c, rC) || rockSpansCrest(m, 20)) continue;
      const s1=slopeAt(a), s2=slopeAt(c), sm=slopeAt(m);
      if(s1*s2<=0 || s1*sm<=0) continue;
      // Closeup pair: keep well under the 25° blade threshold
      const shotMax = ROCK_SLOPE_MAX * 0.55; // ~14°
      if(Math.abs(s1)>shotMax || Math.abs(s2)>shotMax || Math.abs(sm)>shotMax) continue;
      const curv = terrainCurv(m, 22) + terrainCurv(a, 18) + terrainCurv(c, 18);
      if(curv > 1.0) continue;
      const absS=Math.min(Math.abs(s1), Math.abs(s2), Math.abs(sm));
      if(absS<0.06 || absS>shotMax) continue;
      // Prefer gentler seats for the closeup pair (still under ~25°)
      const score = Math.abs(absS-0.14)*6 + Math.max(0, curv)*6 + (curv<-1?-5:0);
      if(score<bestScore){ bestScore=score; bestX=x; }
    }
    const shotMax = ROCK_SLOPE_MAX * 0.55; // ~14°
    if(bestX==null){
      // Fallback: first gentle non-crest seat
      for(let x=400; x<1800; x+=8){
        if(rockSpansCrest(x,rA) || Math.abs(slopeAt(x))>shotMax || terrainCurv(x,18)>1.2) continue;
        bestX=x; break;
      }
      if(bestX==null) bestX = seatOnSlope(900);
    }
    const aX=bestX;
    let cSafe=null;
    for(let dx=0; dx<320; dx+=4){
      const cx0=aX+pairGap+dx;
      if(rockSpansCrest(cx0, rC) || terrainCurv(cx0,18)>1.2) continue;
      if(Math.abs(slopeAt(cx0))>shotMax) continue;
      cSafe=cx0; break;
    }
    if(cSafe==null){
      // Widen search rather than accept a steep seat
      for(let x=aX+110; x<aX+420; x+=4){
        if(rockSpansCrest(x, rC) || Math.abs(slopeAt(x))>shotMax || terrainCurv(x,18)>1.2) continue;
        cSafe=x; break;
      }
    }
    if(cSafe==null) cSafe=aX+pairGap;
    const seedA = 14, seedB = nextDistinctRockSeed(53, seedA);
    S.boulders = [
      {x:aX, r:rA, bury:0.45, hit:false, seed:seedA},
      {x:cSafe, r:rC, bury:0.44, hit:false, seed:seedB}
    ];
    const mid=(aX+cSafe)/2;
    // Sled near first rock for landscape QA
    S.p.x=aX - 90; S.p.y=groundY(S.p.x); S.p.ang=slopeAt(S.p.x);
    S.p.vx=30; S.p.charge=0.7; S.lean=0; S.bob=0; S.throtGlow=0;
    window.__BC_ROCKS_SHOT={
      a:aX, c:cSafe, mid, slope:slopeAt(mid), sA:slopeAt(aX), sB:slopeAt(cSafe),
      curvA:terrainCurv(aX,18), curvC:terrainCurv(cSafe,18),
      spansCrest: rockSpansCrest(aX,rA)||rockSpansCrest(cSafe,rC),
      gap:cSafe-aX
    };
  }
  // Precompute sled px so rockDims is absolute even before blitSled runs
  if(ART.world && ART.world.frames.sled){
    const sf=ART.world.frames.sled, sc=artScale();
    window.__BC_SLED_PX={w:(sf.w/2)*sc, h:(sf.h/2)*sc, landscape:W>H, artScale:sc};
  }
  syncHud();
  computeCam(S.p);
  if(SHOT==='rocks' && window.__BC_ROCKS_SHOT){
    const mid=window.__BC_ROCKS_SHOT.mid;
    const camX=mid - W*0.50;
    const gy=groundY(mid);
    const camY=gy - H*0.55;
    camSmoothY=camY;
    lastCam={x:camX, y:camY, groundScreenY:gy-camY, sledScreenY:S.p.y-camY};
  }
  window.__BC_GAME={
    running:false, x:S.p.x, on:S.p.on, ang:S.p.ang, height:S.height, score:S.score,
    jumpsLanded:S.jumpsLanded, tricksLanded:S.tricksLanded, lives:S.p.lives,
    airTime:S.airTime, meter:S.meter, finished:false, CAM_ROT, shot:SHOT, bg:BG.key, levelIdx,
    groundScreenY:lastCam.groundScreenY, sledScreenY:lastCam.sledScreenY
  };
  window.__BC_BG={
    key:BG.key, treat:BG.treat||BG_TREAT, levelIdx,
    rotation:BG_ROTATION.slice(), loaded:[], platesDropped:true,
    settings:Object.keys(SETTINGS)
  };
}

Promise.all([initArt()]).then(async ()=>{
  resize(); reset();
  if(SHOT) applyShotFreeze();
  last=performance.now();
  raf=requestAnimationFrame(loop);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  if(AUTO) await runAutoTest();
  window.__BC_READY=true;
});
</script>
