<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1c28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Backcountry Climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    /* One big trick button — raised above home indicator */
    --trick-size: clamp(92px, 24vw, 118px);
    --trick-bottom: max(96px, calc(var(--safe-b) + 72px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#1a2836;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:Sora,system-ui,sans-serif;color:#e8f2f6}
  #cv{display:block;width:100vw;height:100vh;background:#1a2836}
  #hud{
    position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;
    padding:calc(10px + var(--safe-t)) 14px 0;
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  }
  #hud .L h1{
    margin:0;font:800 15px/1.1 Syne,Sora,sans-serif;letter-spacing:.02em;color:#e8f2f6;
    text-shadow:0 1px 2px #000c, 0 2px 10px #000a;
  }
  #hud .L .sub, #hud .L #sub{
    margin:4px 0 0;font:800 16px/1.2 Syne,Sora,sans-serif;letter-spacing:.02em;
    color:#ffffff !important; opacity:1 !important;
    -webkit-text-stroke:0.25px rgba(0,0,0,.35);
    text-shadow:0 0 2px #000, 0 1px 2px #000, 0 2px 14px #000e;
  }
  #hud .R{text-align:right}
  #hud .hearts{font:700 15px/1 Sora,sans-serif;letter-spacing:.06em}
  #hud .charge{margin-top:6px;width:110px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-left:auto}
  #hud .charge>i{display:block;height:100%;width:100%;background:#5ec4a8;border-radius:4px}
  /* Toast kept in DOM but unused — gameplay feedback is mid-screen canvas only */
  #toast{display:none}
  /* Single trick control — translucent circle, not pill/boxy */
  #trick{
    position:fixed;z-index:6;
    width:var(--trick-size);height:var(--trick-size);
    right:max(14px, calc(var(--safe-r) + 12px));
    bottom:var(--trick-bottom);
    border:1.5px solid rgba(232,242,246,.45);
    border-radius:50%;
    background:rgba(8,22,34,.40);
    color:#e8f2f6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font:700 11px/1 Sora,sans-serif;letter-spacing:.03em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    touch-action:manipulation;padding:0;margin:0;
  }
  #trick svg{width:30px;height:30px;display:block;pointer-events:none}
  #trick span{opacity:.9;pointer-events:none}
  #trick small{font:600 9px/1 Sora,sans-serif;opacity:.7;pointer-events:none}
  #trick.on{background:rgba(240,180,41,.28);border-color:#f0b429}
  #throtHint{
    position:fixed;z-index:2;pointer-events:none;
    left:max(12px, calc(var(--safe-l) + 8px));
    bottom:var(--trick-bottom);
    /* Match HUD #sub weight / opacity / shadow */
    font:800 16px/1.2 Syne,Sora,sans-serif;letter-spacing:.02em;
    color:#ffffff !important; opacity:1 !important;
    -webkit-text-stroke:0.35px rgba(0,0,0,.45);
    text-shadow:0 1px 2px #000c, 0 2px 10px #000a;
    max-width:44vw;
    transition:opacity .6s ease;
  }
  #throtHint.hide{opacity:0 !important; visibility:hidden !important; display:none !important}
  @media (orientation:landscape){
    :root{
      --trick-size: clamp(72px, 16vh, 96px);
      /* Clear home indicator in landscape too */
      --trick-bottom: max(48px, calc(var(--safe-b) + 40px));
    }
  }
  #end{
    position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
    background:rgba(5,14,20,.72);padding:24px;
  }
  #end.on{display:flex}
  #end .card{
    width:min(360px,100%);background:rgba(10,24,36,.92);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:22px 18px;text-align:center;
  }
  #end h2{margin:0 0 8px;font:800 24px Syne,Sora,sans-serif}
  #end p{margin:0 0 16px;color:#b9d8e8;font:600 13px/1.4 Sora,sans-serif}
  #end button{
    min-height:48px;width:100%;border:0;border-radius:12px;background:#5ec4a8;color:#0b1c28;
    font:800 15px Syne,Sora,sans-serif;touch-action:manipulation;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="L">
    <h1>CORDUROY CLIMB</h1>
    <div class="sub" id="sub">↑ 0 m</div>
  </div>
  <div class="R">
    <div class="hearts" id="hearts">♥♥♥♥♡</div>
    <div class="charge"><i id="chg"></i></div>
  </div>
</div>
<div id="toast"></div>
<div id="throtHint">Hold left side<br>to throttle</div>
<button type="button" id="trick" aria-label="Trick">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M16 24V9M16 9l-5 5M16 9l5 5M8 24c4-3 12-3 16 0"/></svg>
  <span>TRICK</span>
  <small>tap · hold</small>
</button>
<div id="end"><div class="card"><h2 id="endTitle">SUMMIT</h2><p id="endBody"></p><button type="button" id="again">CLIMB AGAIN</button></div></div>
<script>
'use strict';

const params=new URLSearchParams(location.search);
const AUTO=params.get('autoTest')==='1';
const FORCE_BG=params.get('bg');
const SHOT=params.get('shot'); // climb|pop|meter|green|landed|crash|controls|air|land|rocks
const FORCE_TREAT=Math.max(1, Math.min(3, +(params.get('treat')||3)|0));

const cv=document.getElementById('cv');
const cx=cv.getContext('2d',{willReadFrequently:true});
const trickEl=document.getElementById('trick');
const toastEl=document.getElementById('toast');
const throtHintEl=document.getElementById('throtHint');
const endEl=document.getElementById('end');
let tipsAfterFirstRun=false; // throttle hint fades after first completed run

const ART_BASE='art/';
const HUMAN_H_FRAC=0.10;
const CAM_ROT=0;
const LEVEL_LEN=2400;

const BG_CANDIDATES=['trailhead','meadow','creek','alpine-dusk'];
const BG_ALTERNATES=[]; // plates dropped from first load
let BG_ROTATION=BG_CANDIDATES.slice();
let BG_TREAT=FORCE_TREAT; // 1 Alto-soft · 2 HCR-chunky · 3 Place-continuous
let levelIdx=0; // bumps each summit / wipe → next setting
/** Seeded short/medium/long gaps — never the same gap class twice in a row. */
function buildIrregularLips(){
  const GAP={short:140, medium:210, long:300};
  const keys=['short','medium','long'];
  const out=[];
  // Start after first-screen hut/rocks/truck pocket so climb props sit on flat road
  let x=820, prev=null, i=0;
  while(x < LEVEL_LEN-160 && out.length < 12){
    const choices=keys.filter(k=>k!==prev);
    const gk=choices[((i*17+29)|0)%choices.length];
    prev=gk;
    const seed=(i*41+13)|0;
    // Alternate small/big, force big on indices 1,3,5 so autoTest always has ≥3
    const big=(i%2)===1 || i===5;
    const w=big ? (128+(seed%4)*6) : (86+(seed%4)*6);
    const amp=big ? (88+(seed%5)*4) : (32+(seed%4)*4);
    out.push([x|0, w|0, amp|0]);
    x += w + GAP[gk] + ((seed%7)-3);
    i++;
  }
  return out;
}
const LIPS=buildIrregularLips();

/** Flat shelves cut into terrain under hut/truck/sign (cleared each reset). */
let TERRAIN_SHELVES=[];
function clearTerrainShelves(){ TERRAIN_SHELVES=[]; }
function cutTerrainShelf(cx, half, y){
  if(!(half>0) || !isFinite(y) || !isFinite(cx)) return;
  TERRAIN_SHELVES.push({cx, half, y});
}
const BIG_AIR_AMP=70;
const BIG_AIR_TIME=0.42; // airtime threshold for meter
const METER_GREEN=[0.40, 0.90];
const METER_GOLD=[0.70, 0.80];
const TRICKS=[
  {id:'heel', lab:'HEEL CLICKER', pts:120, spin:Math.PI},
  {id:'nohand', lab:'NO-HANDER', pts:140, spin:Math.PI},
  {id:'super', lab:'SUPERMAN', pts:160, spin:Math.PI*1.5},
  {id:'barrel', lab:'BARREL ROLL', pts:200, spin:Math.PI*2},
  {id:'backflip', lab:'BACKFLIP', pts:260, spin:-Math.PI*2},
  {id:'720', lab:'720 SPIN', pts:320, spin:Math.PI*4}
];

let W=390, H=844, DPR=1;
let ART={ready:false, world:null, rider:null};

const SETTINGS={
  trailhead:{
    id:'trailhead', name:'Logging-road trailhead', zone:'trailhead',
    sky:['#5a84a8','#9bb8d0','#e0ecf4'], snow:'#d8e6f0', shade:'#8aa0b0', tint:'#c5d6e4',
    far:['#7a90a4','#96a8b8'], midSnow:['#d8e6f0','#b0c4d4'],
    forest:['#2a4a38','#3d6a4e','#5a8a68'], fog:[220,230,240],
    rock:['#3a4550','#4e5a66','#636e7a'], rockRim:'#9aa6b2'
  },
  meadow:{
    id:'meadow', name:'Open meadow', zone:'meadow',
    sky:['#6a9ec4','#b4d2e8','#f2f7fb'], snow:'#e8f2f8', shade:'#a8c0d4', tint:'#dceaf4',
    far:['#8aa0b4','#a8bcc8'], midSnow:['#e8f2f8','#c4d6e4'],
    forest:['#355848','#4e7a60','#6a9878'], fog:[230,240,248],
    rock:['#3a4550','#4e5a66','#636e7a'], rockRim:'#9aa6b2'
  },
  creek:{
    id:'creek', name:'Frozen creek basin', zone:'creek',
    sky:['#4e7a9a','#8eb4cc','#d8e6f0'], snow:'#d0e0ec', shade:'#7a98ac', tint:'#b8d0e0',
    far:['#6a8498','#8498a8'], midSnow:['#d0e0ec','#a8c0d0'],
    forest:['#1e4034','#2f5e48','#457a60'], fog:[200,220,232], ice:'#8ec8e0',
    rock:['#364048','#4a5660','#5e6a74'], rockRim:'#8a96a0'
  },
  'alpine-dusk':{
    id:'alpine-dusk', name:'High alpine at dusk', zone:'dusk', dusk:1,
    sky:['#1e2a4a','#b06858','#f0c8a0'], snow:'#f4eef2', shade:'#c4b0bc', tint:'#ebe2e8',
    far:['#3a3a52','#5a4a58'], midSnow:['#f6f0f4','#e2d0da'],
    forest:['#2e3834','#44504a','#5e6a62'], fog:[236,224,232],
    rock:['#3e3a48','#524e5c','#686470'], rockRim:'#a098a4'
  }
};
let BG={ key:'trailhead', treat:BG_TREAT, plates:{}, sample:{} };
let input={
  throttle:false, trick:false, trickDownAt:0, trickWasHold:false,
  throtPointers:new Set()
};
let S=null;
let toastT=0;
let scorePops=[]; // {lab, pts, t, x, y}
let raf=0;
let camSmoothY=null;
let lastCam={x:0,y:0};

function plateIdForLevel(i){
  if(!BG_ROTATION.length) return 'trailhead';
  return BG_ROTATION[((i%BG_ROTATION.length)+BG_ROTATION.length)%BG_ROTATION.length];
}
function resolveBgKey(){
  if(FORCE_BG && SETTINGS[FORCE_BG]) return FORCE_BG;
  const alias={
    'rocky-ridge':'trailhead','open-snowfield':'meadow','frozen-lake':'creek',
    'dusk-glow':'alpine-dusk','alpine-bowl':'alpine-dusk','aspen-grove':'trailhead',
    'storm':'creek','alpenglow':'alpine-dusk'
  };
  if(FORCE_BG && alias[FORCE_BG]) return alias[FORCE_BG];
  return plateIdForLevel(levelIdx);
}
function settingLook(key){
  return SETTINGS[key] || SETTINGS[resolveBgKey()] || SETTINGS.trailhead;
}

function loadImage(src){
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
}
function loadAtlas(json,img){
  return fetch(json,{cache:'no-store'}).then(r=>r.json()).then(meta=>loadImage(img).then(im=>({meta,img:im,frames:meta.frames})));
}
function initArt(){
  return Promise.all([
    loadAtlas(ART_BASE+'world-atlas.json', ART_BASE+'world-atlas@2x.webp'),
    loadAtlas(ART_BASE+'rider-atlas.json', ART_BASE+'rider-atlas@2x.webp').catch(()=>null)
  ]).then(([world,rider])=>{
    ART.world=world; ART.rider=rider; ART.ready=true;
    BG.key = resolveBgKey();
    BG.treat = BG_TREAT;
    window.__BC_BG={
      key:BG.key, treat:BG.treat, levelIdx, rotation:BG_ROTATION.slice(),
      loaded:[], candidates:BG_CANDIDATES.slice(), settings:Object.keys(SETTINGS),
      platesDropped:true
    };
  });
}

function lipDelta(wx){
  let lip=0;
  for(const [cx0,w,amp] of LIPS){
    const t=(wx-cx0)/w;
    if(t>=0&&t<=1){
      const face=Math.sin(t*Math.PI);
      const bias=t<0.5 ? 1 : 0.55+0.45*(1-t)/0.5;
      lip -= amp * face * bias;
    }
  }
  return lip;
}

function onFeatureSpan(wx, pad){
  pad=pad||18;
  for(const [cx0,w] of LIPS){
    if(wx>=cx0-pad && wx<=cx0+w+pad) return true;
  }
  return false;
}

function baseGroundY(wx){
  const base=420;
  const grade=-(wx)*0.085;
  const roll=Math.sin(wx*0.011)*18+Math.sin(wx*0.027+1.2)*9;
  return base+grade+roll;
}

function groundY(wx){
  let y = baseGroundY(wx)+lipDelta(wx);
  // Shelves cut into the slope: flat pad, soft blend at edges
  for(let i=0;i<TERRAIN_SHELVES.length;i++){
    const sh=TERRAIN_SHELVES[i];
    const d=Math.abs(wx - sh.cx);
    if(d > sh.half) continue;
    const edge=Math.max(6, sh.half*0.22);
    const inner=sh.half - edge;
    if(d <= inner) return sh.y;
    const t=(d - inner)/edge;
    const u=t*t*(3-2*t);
    y = sh.y*(1-u) + y*u;
  }
  return y;
}
function slopeAt(wx){
  const dx=14;
  return Math.atan2(groundY(wx+dx)-groundY(wx-dx), dx*2);
}
function baseSlopeAt(wx){
  const dx=14;
  return Math.atan2(baseGroundY(wx+dx)-baseGroundY(wx-dx), dx*2);
}

function plantPineX(seed){
  let x=seed;
  for(let i=0;i<24;i++){
    if(!onFeatureSpan(x, 28)) return x;
    x += 36;
  }
  return x;
}

function buildPines(){
  const out=[];
  // Keep clear of hut shelf (~240–320) and first-screen rock pocket (~420–560)
  const seeds=[150, 860, 1280, 1780, 2280];
  for(const seed of seeds){
    let x=plantPineX(seed);
    if(x>=220 && x<=340) x=plantPineX(150);
    if(x>=400 && x<=560) x=plantPineX(560+40);
    out.push({x, s:0.9+((x*13)%10)/100});
  }
  return out;
}

function terrainCurv(x, span){
  const sp=span||18;
  const y=groundY(x), left=groundY(x-sp), right=groundY(x+sp);
  return left + right - 2*y;
}

const ROCK_SLOPE_MAX = Math.tan(25 * Math.PI / 180); // ~0.466 — no blade seats on steep faces
function seatOnSlope(seedX){
  let best=seedX, bestScore=1e9;
  for(let dx=-120; dx<=120; dx+=3){
    const x=seedX+dx;
    if(x < 300 || x > LEVEL_LEN-120) continue;
    const s=Math.abs(slopeAt(x));
    const curv=terrainCurv(x, 20);
    const isPeak = curv > 1.5;
    const onLip = onFeatureSpan(x, 28) ? 40 : 0;
    const steep = s > ROCK_SLOPE_MAX ? 200 + (s - ROCK_SLOPE_MAX) * 80 : 0;
    const score = Math.abs(s-0.18)*6 + Math.max(0, curv)*4.5 + (isPeak?120:0)
      + (curv<-2 ? -8 : 0) + (s<0.05?4:0) + (s>0.55?10:0) + onLip + steep;
    if(score<bestScore){bestScore=score; best=x;}
  }
  return Math.max(300, Math.min(LEVEL_LEN-120, best));
}

function rockSpansCrest(x, r){
  const half=Math.max(14, r*1.05);
  const yC=groundY(x), yL=groundY(x-half), yR=groundY(x+half);
  const chordMid = (yL+yR)*0.5;
  return yC < chordMid - 2.5 || terrainCurv(x, half) > 2;
}

function pineGapForRock(r){
  return Math.max(70, r * 2.05 * 1.5 + 36);
}
function tooCloseToPine(x, r, pines){
  const gap=pineGapForRock(r);
  const list=pines || (S && S.pines) || [];
  return list.some(pn=>Math.abs(pn.x - x) < gap);
}
function seatClearOfPines(seedX, r){
  let x=seatOnSlope(seedX);
  if(!tooCloseToPine(x, r) && Math.abs(slopeAt(x)) <= ROCK_SLOPE_MAX) return x;
  for(let dx=24; dx<=220; dx+=12){
    for(const dir of [1,-1]){
      const nx=seatOnSlope(seedX + dir*dx);
      if(!tooCloseToPine(nx, r) && Math.abs(slopeAt(nx)) <= ROCK_SLOPE_MAX) return nx;
    }
  }
  return x + 160;
}

function lipAmpAt(wx){
  for(const [cx0,w,amp] of LIPS){
    if(wx>=cx0-8 && wx<=cx0+w+8) return amp;
  }
  return 0;
}
function isBigAirEligible(){
  if(!S) return false;
  if(S.bigAirLatch) return true;
  if(S.airTime>=BIG_AIR_TIME) return true;
  if(S.launchAmp>=BIG_AIR_AMP) return true;
  const gap=Math.max(0, groundY(S.p.x)-S.p.y);
  return gap>=72;
}

function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
  const tr=trickEl.getBoundingClientRect();
  window.__BC_CTRL={
    W,H, orientation: W>H?'landscape':'portrait',
    trick:{x:tr.left,y:tr.top,w:tr.width,h:tr.height,
      visible:tr.bottom<=H+1&&tr.top>=-1&&tr.right<=W+1&&tr.left>=-1,
      fracY:(tr.top+tr.height/2)/H,
      bottomClear:H-(tr.bottom)},
    throttleZone:{x:0,y:0,w:Math.min(W*0.62, W-tr.width-24), h:H}
  };
}
addEventListener('resize', ()=>{resize();});
addEventListener('orientationchange', ()=>{setTimeout(resize, 60);});

function pointInTrick(x,y){
  const r=trickEl.getBoundingClientRect();
  const pad=8;
  return x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad;
}
function syncThrottle(){
  input.throttle = input.throtPointers.size>0 || input._keyThrottle;
}

function onThrotDown(e){
  if(e.target===trickEl || trickEl.contains(e.target)) return;
  if(pointInTrick(e.clientX, e.clientY)) return;
  const tr=trickEl.getBoundingClientRect();
  if(e.clientX >= tr.left - 4) return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  input.throtPointers.add(e.pointerId);
  syncThrottle();
}
function onThrotUp(e){
  if(!input.throtPointers.has(e.pointerId)) return;
  e.preventDefault();
  input.throtPointers.delete(e.pointerId);
  syncThrottle();
}
cv.addEventListener('pointerdown', onThrotDown);
cv.addEventListener('pointerup', onThrotUp);
cv.addEventListener('pointercancel', onThrotUp);
addEventListener('pointerup', onThrotUp);
addEventListener('pointercancel', onThrotUp);

function onTrickDown(e){
  e.preventDefault(); e.stopPropagation();
  input.trick=true; input.trickDownAt=performance.now(); input.trickWasHold=false;
  trickEl.classList.add('on');
  if(S && S.p.on){
  } else if(S && !S.p.on){
    beginAirTrickHold();
  }
}
function onTrickUp(e){
  e.preventDefault(); e.stopPropagation();
  const heldMs=performance.now()-input.trickDownAt;
  const wasHold=heldMs>=180 || input.trickWasHold;
  input.trick=false; trickEl.classList.remove('on');
  if(!S) return;
  if(S.p.on){
    if(!wasHold) doGroundPop();
  } else {
    if(S.meter.active){
      releaseMeter(heldMs, wasHold);
    } else if(!wasHold){
      doAirTapTrick();
    } else {
      commitHoldChain(false);
    }
  }
}
trickEl.addEventListener('pointerdown', onTrickDown);
trickEl.addEventListener('pointerup', onTrickUp);
trickEl.addEventListener('pointercancel', onTrickUp);
trickEl.addEventListener('pointerleave', e=>{ if(e.buttons===0 && input.trick) onTrickUp(e); });

addEventListener('keydown', e=>{
  if(e.code==='ArrowRight'||e.code==='KeyD'){ input._keyThrottle=true; syncThrottle(); }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(!input.trick){ input.trick=true; input.trickDownAt=performance.now(); input.trickWasHold=false; trickEl.classList.add('on');
      if(S&&!S.p.on) beginAirTrickHold();
    }
  }
});
addEventListener('keyup', e=>{
  if(e.code==='ArrowRight'||e.code==='KeyD'){ input._keyThrottle=false; syncThrottle(); }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(input.trick) onTrickUp(e);
  }
});

function midFlash(lab, pts, perfect){
  scorePops.push({
    lab,
    pts: (pts==null ? null : pts),
    perfect:!!perfect,
    t:1.45
  });
}
function toast(msg){
  midFlash(msg, null, msg.indexOf('★')>=0 || /PERFECT|STICK IT/i.test(msg));
}
function scorePopup(lab, pts, perfect){
  midFlash(lab, pts, perfect);
}

function doGroundPop(){
  if(!S||!S.p.on||S.p._hopLatch) return;
  const p=S.p;
  if(p.vx<90) p.vx=110;
  p.on=false; p.vy=-480 - p.vx*0.28; p._hopLatch=true; p.ang=slopeAt(p.x)-0.22;
  S.airTime=0; S.launchAmp=lipAmpAt(p.x); S.bigAirLatch=false;
  resetMeter();
  toast('POP');
}
function doAirTapTrick(){
  if(!S||S.p.on) return;
  if(S.meter.active && S.meter.committed) return;
  const t=TRICKS[(S.trickIdx++)%4];
  S.p.trick=t; S.p.trickT=0; S.p.spinTarget=t.spin; S.p.spinAcc=0;
  S.chainCount=1; S.chainLabs=[t.lab];
  if(!S.meter.active && !isBigAirEligible()){
    S.meter.committed=true; S.meter.stick='clean'; S.meter.level=0.35;
  }
  toast(t.lab);
}
function beginAirTrickHold(){
  if(!S||S.p.on) return;
  input.trickWasHold=true;
  const big=isBigAirEligible();
  if(big){
    S.bigAirLatch=true;
    S.meter.active=true; S.meter.level=Math.max(S.meter.level, 0.08);
    S.meter.committed=false; S.meter.stick=null; S.meter.holding=true;
  }
  if(!S.p.trick){
    const t=TRICKS[(S.trickIdx++)%TRICKS.length];
    S.p.trick=t; S.p.trickT=0; S.p.spinTarget=t.spin; S.p.spinAcc=0;
    S.chainCount=1; S.chainLabs=[t.lab];
  }
}
function releaseMeter(heldMs, wasHold){
  if(!S||!S.meter.active) return;
  S.meter.holding=false;
  const lv=S.meter.level;
  const inGold=lv>=METER_GOLD[0] && lv<=METER_GOLD[1];
  const inGreen=lv>=METER_GREEN[0] && lv<=METER_GREEN[1];
  if(inGold || inGreen){
    S.meter.committed=true;
    S.meter.stick=inGold?'perfect':'clean';
    if(!S.p.trick){
      const t=TRICKS[Math.min(5, Math.floor(lv*6))];
      S.p.trick=t; S.chainLabs=[t.lab]; S.chainCount=1;
      S.p.spinTarget=t.spin; S.p.spinAcc=t.spin;
    } else {
      S.p.spinAcc=S.p.spinTarget||0;
    }
  } else {
    S.meter.committed=true;
    S.meter.stick='crash';
    S.meter.crash=true;
  }
}
function commitHoldChain(fromMeter){
  if(!S) return;
  S.meter.committed=true;
  S.meter.stick='clean';
  if(S.p.trick && S.p.spinTarget) S.p.spinAcc=S.p.spinTarget;
}
function resetMeter(){
  if(!S) return;
  S.meter={active:false, level:0, holding:false, committed:false, stick:null, crash:false};
  S.chainCount=0; S.chainLabs=[];
}
function advanceChain(dt){
  if(!S||!input.trick||S.p.on) return;
  const rate = S.meter.active ? 1.15 : 0.9;
  S.chainTimer = (S.chainTimer||0) + dt*rate;
  if(S.chainTimer > 0.38){
    S.chainTimer=0;
    const t=TRICKS[(S.trickIdx++)%TRICKS.length];
    S.p.trick=t; S.p.trickT=0;
    S.p.spinTarget=(S.p.spinTarget||0) + t.spin;
    S.chainCount=(S.chainCount||0)+1;
    S.chainLabs=(S.chainLabs||[]).concat([t.lab]);
    if(S.chainLabs.length>4) S.chainLabs.shift();
  }
  if(S.meter.active && S.meter.holding){
    S.meter.level=Math.min(1, S.meter.level + dt*0.55);
  }
}

function syncHud(){
  if(!S) return;
  const p=S.p;
  S.height=Math.max(0, Math.round((p.x/LEVEL_LEN)*486));
  S.bestHeight=Math.max(S.bestHeight, S.height);
  S.dist=p.x;
  document.getElementById('sub').textContent='↑ '+S.height+' m  ·  '+S.score+' pts'+(S.combo>1?'  ·  ×'+S.combo.toFixed(1):'');
  document.getElementById('hearts').textContent='♥'.repeat(Math.max(0,p.lives))+'♡'.repeat(Math.max(0,5-p.lives));
  document.getElementById('chg').style.width=(Math.max(0,Math.min(1,p.charge))*100)+'%';
}

function reset(){
  endEl.classList.remove('on');
  camSmoothY=null;
  scorePops=[];
  clearTerrainShelves();
  window.__BC_LANDMARK_PLAN = null;
  BG.key = resolveBgKey();
  const p={
    x:80, y:groundY(80)-2, vx:90, vy:0, ang:slopeAt(80),
    on:true, nose:0, lives:4, charge:1,
    trick:null, trickT:0, spinAcc:0, spinTarget:0, pose:0, _hopLatch:false
  };
  S={
    t:0, p, score:0, combo:1, comboChain:0, height:0, bestHeight:0,
    boulders:[], pines:buildPines(), finished:false, crashed:false, dist:0, trickIdx:0,
    landFlash:0, airTime:0, jumpsLanded:0, tricksLanded:0,
    launchAmp:0, bigAirLatch:false, chainCount:0, chainLabs:[], chainTimer:0,
    meter:{active:false, level:0, holding:false, committed:false, stick:null, crash:false},
    lean:0, bob:0, tuck:0, compress:0,
    throtGlow:0, crashPuff:0, throtHeld:0
  };
  // Rocks: b4576e7 size/variety + drift clip; irregular short/medium/long gaps
  const ROCK_GAP={short:160, medium:250, long:360};
  const gapKeys=['short','medium','long'];
  let prevSeed = null, prevGap=null, gi=0;
  let targetX = 420;
  while(targetX < LEVEL_LEN-180 && S.boulders.length < 14){
    const i = S.boulders.length;
    let seed = nextDistinctRockSeed((targetX*0.13 + i*17 + i*3)|0, prevSeed);
    prevSeed = seed;
    const r = 22 + (seed%5)*3 + (i%3)*2; // e962101 hitbox ~22–36
    const rockGap=Math.max(110, r*2.2);
    const near = i < 2;
    const minX = i===0 ? 400 : (S.boulders[i-1].x + rockGap);
    let bx=null, best=1e9;
    const start=Math.max(minX, targetX - (near ? 16 : 36));
    const end=Math.min(LEVEL_LEN-160, start + (near ? 110 : 280));
    for(let x=start; x<end; x+=4){
      if(tooCloseToPine(x, r)) continue;
      if(S.boulders.some(ob=>Math.abs(ob.x-x)<rockGap)) continue;
      if(onFeatureSpan(x, 28)) continue;
      if(rockSpansCrest(x, r) || terrainCurv(x, 18) > 1.5) continue;
      const s=Math.abs(slopeAt(x));
      if(s > ROCK_SLOPE_MAX) continue;
      // Prefer gentler seats so rocks don't read as thin wedges on hump faces
      const score = Math.abs(x-targetX)*0.04 + Math.abs(s-0.12)*3 + (s>0.22?8:0);
      if(score < best){ best=score; bx=x; }
      if(Math.abs(x-targetX) < 50 && s <= 0.22) break;
    }
    if(bx != null){
      S.boulders.push({x:bx, r, spin:0, hit:false, bury:0.42+(seed%6)/100, seed, home:bx});
      if(i===0){
        // First-screen pair: keep the second rock in the gentle pocket (~530)
        targetX = 530;
        prevGap = null;
      } else {
        const choices=gapKeys.filter(k=>k!==prevGap);
        const gk=choices[((gi*19+7)|0)%choices.length];
        prevGap=gk;
        targetX = bx + ROCK_GAP[gk] + ((((gi*11)|0)%9)-4);
        gi++;
      }
    } else {
      targetX += 80;
    }
  }
  if(throtHintEl){
    if(tipsAfterFirstRun) throtHintEl.classList.add('hide');
    else throtHintEl.classList.remove('hide');
  }
  syncHud();
  window.__BC_PINES = S.pines.map(pn=>({x:pn.x, baseY:baseGroundY(pn.x), onFeature:onFeatureSpan(pn.x)}));
  window.__BC_GAME={running:true, levelLen:LEVEL_LEN, pines:window.__BC_PINES};
}

function resolveLanding(){
  const p=S.p;
  const big=S.meter.active || S.bigAirLatch || S.airTime>=BIG_AIR_TIME;
  const stillHolding = S.meter.active && (S.meter.holding || (input.trick && !S.meter.committed));
  const crash = stillHolding || S.meter.crash || (S.meter.active && S.meter.stick==='crash')
    || (S.meter.active && !S.meter.committed && (S.chainCount>0 || p.trick));

  p.y=groundY(p.x); p.vy=0; p.on=true; S.landFlash=0.35; S.compress=1; p._hopLatch=false;

  if(crash){
    if(!S._auto) p.lives--;
    toast(stillHolding?'HELD TOO LONG':'UNDER-ROTATED');
    p.trick=null; p.spinAcc=0; p.spinTarget=0;
    S.combo=1; S.comboChain=0; p.vx*=0.45;
    applyCrashPose(p);
  } else if(S.meter.active && S.meter.committed && (S.meter.stick==='clean'||S.meter.stick==='perfect')){
    S.jumpsLanded++;
    const lvl=Math.max(0.2, S.meter.level);
    const perfect=S.meter.stick==='perfect';
    const baseTrick=p.trick || TRICKS[Math.min(5, Math.floor(lvl*6))];
    const chainN=Math.max(1, S.chainCount||1);
    const mult=(perfect?1.6:1.15) * (1+(chainN-1)*0.35) * (0.7+lvl*0.9) * S.combo;
    const pts=Math.round(baseTrick.pts * mult);
    const lab = (S.chainLabs && S.chainLabs.length)
      ? (chainN>1 ? S.chainLabs[S.chainLabs.length-1]+' ×'+chainN : S.chainLabs[S.chainLabs.length-1])
      : baseTrick.lab;
    S.score+=pts; S.tricksLanded++; S.comboChain++;
    if(S.comboChain>=2) S.combo=Math.min(4, 1+S.comboChain*0.35);
    scorePopup(lab, pts, perfect);
    p.trick=null; p.spinAcc=0; p.spinTarget=0; p.ang=slopeAt(p.x);
  } else if(p.trick && !big){
    S.jumpsLanded++;
    const pts=Math.round(p.trick.pts * S.combo);
    S.score+=pts; S.tricksLanded++; S.comboChain++;
    if(S.comboChain>=2) S.combo=Math.min(4, 1+S.comboChain*0.35);
    scorePopup(p.trick.lab, pts, false);
    p.trick=null; p.spinAcc=0; p.spinTarget=0; p.ang=slopeAt(p.x);
  } else {
    S.jumpsLanded++;
    if(S.airTime>0.28){ S.score+=40; toast('CLEAN'); }
    p.ang=slopeAt(p.x); p.trick=null; p.spinAcc=0; p.spinTarget=0;
  }

  S.airTime=0; S.launchAmp=0; S.bigAirLatch=false;
  resetMeter();
}

function step(dt){
  if(!S||S.finished) return;
  const p=S.p;
  S.t+=dt;
  const glowTgt = input.throttle ? 1 : 0;
  S.throtGlow += (glowTgt - S.throtGlow)*Math.min(1, 10*dt);
  if(input.throttle) S.throtHeld = (S.throtHeld||0) + dt;
  if(throtHintEl && !tipsAfterFirstRun){
    if((S.throtHeld||0) >= 3) throtHintEl.classList.add('hide');
    else throtHintEl.classList.remove('hide');
  }
  if(S.landFlash>0) S.landFlash-=dt;
  if(S.crashPuff>0 && !SHOT) S.crashPuff=Math.max(0, S.crashPuff-0.55*dt);
  for(let i=scorePops.length-1;i>=0;i--){
    if(SHOT) break; // freeze result cards for QA shots
    scorePops[i].t-=dt;
    if(scorePops[i].t<=0) scorePops.splice(i,1);
  }

  if(input.trick && performance.now()-input.trickDownAt>180){
    input.trickWasHold=true;
    if(!p.on && !S.meter.holding) beginAirTrickHold();
  }
  if(!p.on) advanceChain(dt);

  if(!p.on && input.trick && !S.meter.active && isBigAirEligible()){
    beginAirTrickHold();
  }

  const slope=slopeAt(p.x);
  const climbLean = Math.max(-0.22, Math.min(0.28, -slope*0.55 - (input.throttle&&slope>0.05?0.08:0) + (!p.on&&input.trick?0.1:0)));
  const bump = Math.abs(lipDelta(p.x)-lipDelta(p.x-10))*0.04 + Math.abs(Math.sin(p.x*0.027))*0.5;
  if(p.on){
    const thr=input.throttle?1:0;
    const steep=Math.max(0, -slope);
    const acc=(980*thr - 520*(1-thr) - steep*1400);
    p.vx=Math.max(35, Math.min(480, p.vx+acc*dt));
    p.x+=p.vx*dt;
    p.y=groundY(p.x);
    p.nose=Math.max(0, p.nose-5*dt);
    p.ang=slope;
    const ahead=slopeAt(p.x+28);
    if(ahead < slope-0.22 && p.vx>140){
      p.on=false;
      const amp=Math.max(lipAmpAt(p.x), lipAmpAt(p.x+20));
      S.launchAmp=amp;
      S.bigAirLatch=amp>=BIG_AIR_AMP;
      const boost = S.bigAirLatch ? 1.25 : 1;
      p.vy=(-680 - Math.max(0,-ahead)*400)*boost;
      p.ang=slope-0.15; S.airTime=0; resetMeter();
    }
    p.charge=Math.max(0, Math.min(1, p.charge - thr*0.07*dt + (1-thr)*0.025*dt));
    S.tuck += (0 - S.tuck)*Math.min(1, 8*dt);
    S.bob += ((Math.sin(S.t*10)*1.6 + bump*2.2) - S.bob)*Math.min(1, 10*dt);
  } else {
    S.airTime+=dt;
    if(!S.bigAirLatch && (S.airTime>=BIG_AIR_TIME || S.launchAmp>=BIG_AIR_AMP)) S.bigAirLatch=true;
    p.vy+=3600*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    if(p.trick && p.spinTarget){
      const remain=p.spinTarget - p.spinAcc;
      const stepA=remain * Math.min(1, dt/0.42);
      p.ang+=stepA; p.spinAcc+=stepA;
    } else if(input.trick){
      p.ang-=1.4*dt;
    } else {
      const tgt=slopeAt(p.x)*0.85;
      p.ang+=(tgt-p.ang)*Math.min(1, 2.2*dt);
    }
    if(p.trick) p.trickT+=dt;
    const g2=groundY(p.x);
    if(p.y>=g2 && p.vy>0){
      resolveLanding();
    }
    p.charge=Math.max(0, p.charge - (input.throttle?0.03:0)*dt);
    const tuckTgt = p.trick || S.meter.active ? 0.16 : 0.08;
    S.tuck += (tuckTgt - S.tuck)*Math.min(1, 6*dt);
    S.bob += (0 - S.bob)*Math.min(1, 6*dt);
  }

  S.lean += (climbLean - S.lean)*Math.min(1, 7*dt);
  if(S.compress>0) S.compress=Math.max(0, S.compress - 2.8*dt);

  for(const b of S.boulders){
    if(b.hit) continue;
    b.x -= (140 + b.r)*dt;
    const y=groundY(b.x), left=groundY(b.x-14), right=groundY(b.x+14);
    if(y < left-1.5 && y < right-1.5) b.x=seatOnSlope(b.x);
    b.spin += 2.0*dt;
    const bury=b.bury||0.45;
    const dx=b.x-p.x, dy=(groundY(b.x)-b.r*(1-bury)) - p.y;
    if(Math.hypot(dx,dy) < b.r*0.7+18 && p.on && !S._auto){
      b.hit=true; p.lives--; p.vx*=0.4; toast('HIT');
      S.combo=1; S.comboChain=0;
    }
  }

  syncHud();

  if(p.lives<=0){ finish(false); return; }
  if(p.x>=LEVEL_LEN){ finish(true); return; }

  window.__BC_GAME={
    running:!S.finished, x:p.x, on:p.on, ang:p.ang, height:S.height, score:S.score,
    jumpsLanded:S.jumpsLanded, tricksLanded:S.tricksLanded, lives:p.lives,
    airTime:S.airTime, meter:S.meter, bigAir:S.bigAirLatch, finished:S.finished, won:S.won,
    CAM_ROT, bg:BG.key, levelIdx
  };
}

function contrastProbe(){
  try{
    const data=cx.getImageData(0,0,cv.width,cv.height).data;
    const ww=cv.width, hh=cv.height;
    function sampleBox(x0,y0,x1,y1){
      let r=0,g=0,b=0,n=0;
      for(let y=y0;y<y1;y+=3){
        for(let x=x0;x<x1;x+=3){
          const i=((y*ww+x)|0)*4; r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
        }
      }
      if(!n) return null;
      r/=n; g/=n; b/=n;
      const lum=0.2126*r+0.7152*g+0.0722*b;
      return {r:r|0,g:g|0,b:b|0,lum:+lum.toFixed(1)};
    }
    const sled=sampleBox(((W*0.32)*DPR)|0, ((H*0.34)*DPR)|0, ((W*0.58)*DPR)|0, ((H*0.55)*DPR)|0);
    const meter=sampleBox(((W*0.02)*DPR)|0, ((H*0.22)*DPR)|0, ((W*0.14)*DPR)|0, ((H*0.55)*DPR)|0);
    const plate=sampleBox(((W*0.55)*DPR)|0, ((H*0.08)*DPR)|0, ((W*0.95)*DPR)|0, ((H*0.40)*DPR)|0);
    const dSled=sled&&plate ? Math.abs(sled.lum-plate.lum) : 0;
    const dMeter=meter&&plate ? Math.abs(meter.lum-plate.lum) : 0;
    const sledOk=dSled>=28;
    const meterOk=dMeter>=22 || (meter && meter.lum>90); // bright meter fill reads even on mid plates
    return {bg:BG.key, sled, meter, plate, dSled:+dSled.toFixed(1), dMeter:+dMeter.toFixed(1), sledOk, meterOk, ok:sledOk&&meterOk};
  }catch(e){
    return {ok:false, err:String(e), bg:BG.key};
  }
}
window.__BC_contrastProbe=contrastProbe;

function finish(won){
  S.finished=true; S.won=won;
  tipsAfterFirstRun=true;
  if(throtHintEl) throtHintEl.classList.add('hide');
  document.getElementById('endTitle').textContent=won?'SUMMIT CLEARED':'WIPED';
  document.getElementById('endBody').textContent=
    (won?'Height '+S.height+' m':'Try again')+' · Score '+S.score+
    ' · Jumps '+S.jumpsLanded+' · Tricks '+S.tricksLanded+
    ' · BG '+BG.key;
  endEl.classList.add('on');
  window.__BC_GAME.finished=true; window.__BC_GAME.won=won;
  window.__BC_GAME.bg=BG.key; window.__BC_GAME.levelIdx=levelIdx;
  levelIdx++;
}
document.getElementById('again').onclick=()=>reset();

function humanPx(){
  if(W > H) return Math.max(H * 0.22, 72);
  return H * HUMAN_H_FRAC;
}
function artScale(){
  const base = humanPx() / 85;
  if(W <= H || !ART.world || !ART.world.frames.sled) return base;
  const nativeW = (ART.world.frames.sled.w / 2) || 120;
  return Math.max(base, 56 / nativeW);
}

const CRASH_BURY_MAX=8;

function crashPenetration(px, py, ang, lean, sw){
  const th=ang + (lean||0);
  const cos=Math.cos(th), sin=Math.sin(th);
  let maxPen= -1e9;
  for(const lx of [-sw/2, -sw/4, 0, sw/4, sw/2]){
    const wx=px + lx*cos;
    const wy=py + lx*sin;
    const pen=wy - groundY(wx);
    if(pen>maxPen) maxPen=pen;
  }
  return maxPen;
}
function applyCrashPose(p){
  if(!p) return;
  const slope=slopeAt(p.x);
  p.y=groundY(p.x) + 1;
  p.on=true;
  S.crashed=true;
  S.crashPuff=1;
  S.lean=0;
  S.bob=0;
  S.tuck=0;
  S.compress=0.2; // slight squash reads as impact without breaking the silhouette
  p.ang=slope; // seat flat on the slope — Look7 skis stay with the body
}

function drawCrashPuff(p){
  if(!S || !(S.crashed || S.crashPuff>0)) return;
  const gy=groundY(p.x);
  const a=Math.max(0.35, Math.min(1, S.crashPuff || 0.85));
  cx.save();
  cx.fillStyle='#f7fbff';
  cx.globalAlpha=0.50*a;
  cx.beginPath(); cx.ellipse(p.x+2, gy+3, 36, 8, 0.04, 0, Math.PI*2); cx.fill();
  cx.globalAlpha=0.32*a;
  cx.beginPath(); cx.ellipse(p.x-12, gy+2, 20, 6, -0.1, 0, Math.PI*2); cx.fill();
  cx.restore();
}

function blitSled(x,y,ang){
  if(!ART.world) return;
  const sf=ART.world.frames.sled;
  const sc=artScale();
  const sw=(sf.w/2)*sc, sh=(sf.h/2)*sc;
  if(typeof window!=='undefined'){
    window.__BC_SLED_PX={w:sw, h:sh, landscape:W>H, artScale:sc};
  }
  const lean=S?S.lean:0;
  const bob=S?S.bob:0;
  const tuck=S?S.tuck:0;
  const compress=S?S.compress:0;
  const sy = 1 - compress*0.14 - tuck*0.08;
  const sx = 1 + compress*0.08 - tuck*0.04;
  cx.save();
  cx.translate(x, y + bob);
  cx.rotate((ang||0) + lean);
  cx.scale(sx, sy);
  cx.drawImage(ART.world.img, sf.x,sf.y,sf.w,sf.h, -sw/2,-sh, sw,sh);
  cx.restore();
}
function blitWorld(name,x,y,ang,opt){
  opt=opt||{};
  if(!ART.world||!ART.world.frames[name]) return;
  const f=ART.world.frames[name];
  const sc=artScale()*(opt.s||1);
  const w=(f.w/2)*sc, h=(f.h/2)*sc;
  cx.save(); cx.translate(x,y); if(ang) cx.rotate(ang);
  if(opt.clipBottom){
    cx.beginPath();
    cx.rect(-w/2, -h, w, h*(1-opt.clipBottom));
    cx.clip();

  const fam = s % 7;
  const peakX = (fam % 3 === 0 ? -0.06 : fam % 3 === 1 ? 0.08 : 0.01) + (j(0)-0.5)*0.04;
  const pts = [];
  pts.push([-w*(0.48+j(1)*0.05),  h*(0.22+j(2)*0.05)]);
  pts.push([-w*(0.52+j(3)*0.04), -h*(0.02+j(4)*0.05)]);
  pts.push([-w*(0.34+j(5)*0.07), -h*(0.30+j(6)*0.07)]);
  pts.push([-w*(0.08+j(7)*0.06), -h*(0.46+j(8)*0.04)]);

  pts.push([ w*(0.30+j(17)*0.05),  h*(0.28+j(18)*0.04)]);

  cx.lineTo(x1 + 4, -1e5);

  const ang = Math.atan2(groundY(b.x + half) - groundY(b.x - half), half * 2);
  const cols = look.rock || ['#3a4550','#4e5a66','#636e7a'];

  const tol = 2.5; // css px — antialias / edge-taper / shelf-blend slack

/**

function assertNearTreesWorldLock(opts){

    const report={ok:false, reason:'no_pines'};
    window.__BC_TREE_HARNESS=report;
    return report;
  }
  const p=S.p;
  const lip = (typeof LIPS!=='undefined' && LIPS[1]) ? LIPS[1] : [560,140,88];
  // Launch off a big lip into air so cam would formerly follow sled y
  p.x = lip[0] + lip[1]*0.55;
  p.on = false;
  p.y = groundY(p.x) - 90;
  p.vy = -140;
  p.vx = Math.max(180, p.vx||200);
  p.ang = slopeAt(p.x) - 0.15;
  camSmoothY = null;

  const track = S.pines.slice(0, 3).map(pn=>({x:pn.x, samples:[]}));
  const samples=[];
  for(let i=0;i<frames;i++){
    step(1/60);
    computeCam(p);
    draw();
    const cam=lastCam;
    const row={i, camX:cam.x, camY:cam.y, sledY:p.y, gy:groundY(p.x), on:p.on, trees:[]};
    for(const t of track){
      const gTree=groundY(t.x);
      const sx=t.x - cam.x;
      const sy=gTree - cam.y;
      const relY = sy - (gTree - cam.y); // ≡ 0 if locked to slope at tree x
      const sample={wx:t.x, sx:+sx.toFixed(3), sy:+sy.toFixed(3), gTree:+gTree.toFixed(3), relY:+relY.toFixed(3)};
      t.samples.push(sample);
      row.trees.push(sample);
    }
    samples.push(row);
  }

  const bad=[];

    for(let i=1;i<t.samples.length;i++){
      const a=t.samples[i-1], b=t.samples[i];
      const dCamX = samples[i].camX - samples[i-1].camX;
      const dCamY = samples[i].camY - samples[i-1].camY;
      const dSx = b.sx - a.sx;
      const dSy = b.sy - a.sy;
      // World-locked: ΔscreenX = −ΔcamX; ΔscreenY = −ΔcamY (tree fixed on slope → 0 dy vs terrain)
      const errX = Math.abs(dSx + dCamX);
      const errY = Math.abs(dSy + dCamY);

  let sledCoupled=0;
  for(let i=1;i<samples.length;i++){
    if(samples[i].on && samples[i-1].on) continue;
    const dSled = samples[i].sledY - samples[i-1].sledY;
    const dCamY = samples[i].camY - samples[i-1].camY;

    midP:(window.__BC_PLATE&&window.__BC_PLATE.midP),
    nearP:(window.__BC_PLATE&&window.__BC_PLATE.nearP),

  return report;
}

function inGlade(x, y, glades){
  for(let g=0;g<glades.length;g++){
    const dx=x-glades[g][0], dy=y-glades[g][1];
    if(dx*dx/(glades[g][2]*glades[g][2])+dy*dy/(glades[g][3]*glades[g][3])<1) return true;
  }
  return false;
}
function buildTrails(x0, top, bot, zone, n){
  const out=[];
  // Long horizontal lean so cuts read as ski trails down the face — never short upright pills
  const spread = zone==='meadow' ? 280 : 230;
  const lean = zone==='creek' ? 160 : (zone==='meadow' ? 260 : 220);
  const zig = zone==='dusk' ? 1.6 : 2.0;
  for(let tr=0; tr<n; tr++){
    const pts=[]; const ox=x0+50+tr*spread+((tr*47)%40);
    for(let k=0;k<=14;k++){
      const u=k/14;
      pts.push([ox+u*lean+Math.sin(u*zig+tr*1.3)*14, top+10+u*(bot-top-28)+Math.sin(u*1.5+tr)*5]);
    }
    out.push(pts);
  }
  return out;
}

/** Clump forest — ~50% mid-slope cover with glades + trail corridors + ragged treeline. */
function drawDenseForest(x0, span, topY, botY, forest, snowCol, trails, dens){
  const faceH=botY-topY;
  // Trees climb most of the face; open ridge is only the top ~12%
  const treeTop=topY+faceH*0.12, treeBot=botY-faceH*0.04;
  const glades=[];
  const nG = dens>=2 ? 6 : 7; // glades keep ~50% open, not sparse empty mid
  for(let gi=0; gi<nG; gi++){
    glades.push([
      x0+60+hash01(gi*11)*span*0.9,
      treeTop+hash01(gi*19)*faceH*0.55,
      30+hash01(gi*3)*40,
      16+hash01(gi*7)*24
    ]);
  }
  const wash=cx.createLinearGradient(0,treeTop,0,treeBot);
  wash.addColorStop(0, rgba(hexRgb(forest[0]),0));
  wash.addColorStop(0.35, rgba(hexRgb(forest[1]),0.18));
  wash.addColorStop(0.8, rgba(hexRgb(forest[2]),0.22));
  wash.addColorStop(1, rgba(hexRgb(forest[2]),0));
  cx.fillStyle=wash; cx.fillRect(x0,treeTop,span,treeBot-treeTop);
  const clumps=Math.floor(span/(dens>=2?26:32));
  for(let c=0;c<clumps;c++){
    if(hash01(c*3.7)<0.06) continue; // light skip → gaps between clumps
    const cx0=x0+36+hash01(c*5.1)*(span-72);
    const cy0=treeTop+10+hash01(c*9.3)*(treeBot-treeTop-22);
    if(trailClear(cx0,cy0,trails,14)||inGlade(cx0,cy0,glades)) continue;
    const nT=6+((hash01(c*2.2)*8)|0);
    for(let k=0;k<nT;k++){
      const ang=hash01(c*11+k*3)*6.28, rad=5+hash01(c+k*7)*20;
      const x=cx0+Math.cos(ang)*rad, y=cy0+Math.sin(ang)*rad*0.55;
      if(y<treeTop-4||y>treeBot) continue;
      if(trailClear(x,y,trails,11)||inGlade(x,y,glades)) continue;
      if(y<treeTop+faceH*0.04&&hash01(c+k)<0.5) continue; // ragged top
      const tone=forest[hash01(c+k*2)<0.33?0:hash01(c+k)<0.7?1:2];
      const h=(12+hash01(c*4+k)*24)*(0.72+hash01(k*3)*0.9);
      drawConifer(x,y,h,tone,snowCol,1);
    }
  }
  // Ragged treeline crowns along the ridge
  for(let i=0;i<Math.floor(span/26);i++){
    if(hash01(i*41)<0.38) continue;
    const x=x0+i*26+hash01(i*9)*16;
    const y=treeTop-2+hash01(i*17)*12;
    if(trailClear(x,y,trails,12)||inGlade(x,y,glades)) continue;
    drawConifer(x,y,10+hash01(i)*15,forest[0],snowCol,1);
  }
}

function drawLodge(x, y, sc, look){
  sc = sc || 1;
  const bw = 58*sc, bh = 26*sc;
  const warm = !!(look && look.dusk);
  const sn = (look&&look.snow)||'#e8eef4';
  cx.fillStyle = rgba(hexRgb(sn), 0.9);
  cx.beginPath(); cx.ellipse(x+bw*0.45, y+bh+3*sc, bw*0.7, 6*sc, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#5c4a3a'; cx.fillRect(x, y, bw, bh);
  cx.fillStyle = '#3e3028'; cx.fillRect(x - 2*sc, y + 1*sc, bw + 4*sc, 3*sc);
  cx.fillStyle = '#f2f6fa';
  cx.beginPath();
  cx.moveTo(x - 11*sc, y + 3*sc);
  cx.lineTo(x + bw*0.5, y - 20*sc);
  cx.lineTo(x + bw + 11*sc, y + 3*sc);
  cx.lineTo(x + bw + 7*sc, y + 9*sc);
  cx.lineTo(x - 7*sc, y + 9*sc);
  cx.closePath(); cx.fill();
  cx.fillStyle = '#4a3c36'; cx.fillRect(x + bw*0.18, y - 26*sc, 7*sc, 16*sc);
  cx.fillStyle = rgba([200,206,214], 0.4);
  for(let s=0;s<4;s++){
    cx.beginPath();
    cx.ellipse(x + bw*0.22 + s*2.4*sc, y - 30*sc - s*5.5*sc, 3.4*sc + s, 2.1*sc, 0, 0, Math.PI*2);
    cx.fill();
  }
  cx.fillStyle = '#3a2a20';
  cx.fillRect(x + bw*0.44, y + bh*0.32, 9*sc, bh*0.68);
  cx.fillStyle = warm ? 'rgba(255,200,110,0.95)' : 'rgba(170,215,235,0.85)';
  cx.fillRect(x + 8*sc, y + 8*sc, 11*sc, 9*sc);
  cx.fillRect(x + bw - 20*sc, y + 8*sc, 11*sc, 9*sc);
  if(warm){
    cx.fillStyle = 'rgba(255,220,140,0.30)';
    cx.beginPath(); cx.ellipse(x + bw*0.45, y + bh*0.4, bw*0.55, bh*0.5, 0, 0, Math.PI*2); cx.fill();
  }
}
function drawTruck(x, y, sc){
  sc = sc || 1;
  // Soft contact shadow only — no berm strokes / dark wedge under the chassis
  cx.fillStyle = 'rgba(180,200,220,0.22)';
  cx.beginPath(); cx.ellipse(x + 30*sc, y + 2*sc, 36*sc, 2.4*sc, 0, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#343e48'; cx.fillRect(x + 24*sc, y - 11*sc, 44*sc, 13*sc);
  cx.fillStyle = '#2a323a'; cx.fillRect(x + 26*sc, y - 14*sc, 40*sc, 4*sc);
  cx.fillStyle = '#4a5560'; cx.fillRect(x, y - 13*sc, 26*sc, 15*sc);
  cx.fillStyle = '#5a6570'; cx.fillRect(x + 2*sc, y - 20*sc, 15*sc, 9*sc);
  cx.fillStyle = 'rgba(160,200,220,0.75)'; cx.fillRect(x + 4*sc, y - 18*sc, 9*sc, 5*sc);
  cx.strokeStyle = '#2a323a'; cx.lineWidth = 2*sc;
  cx.beginPath(); cx.moveTo(x + 24*sc, y - 4*sc); cx.lineTo(x + 28*sc, y - 4*sc); cx.stroke();
  cx.fillStyle = '#141a22';
  [[8,2],[20,2],[36,2],[54,2]].forEach(([wx,wy])=>{
    cx.beginPath(); cx.arc(x + wx*sc, y + wy*sc, 3.6*sc, 0, Math.PI*2); cx.fill();
  });
}

/**
 * Backdrop: far ridge/sky essentially static (no vertical drift);
 * at most ONE distant forest band at one clear parallax rate;
 * climb-side trees/hut/truck/fence are world-locked (drawn in drawWorldLandmarks).
 * No layer uses the sled's y. No tree sway.
 */
function drawBackdrop(camX, terrainScreenY){
  const look = settingLook(BG.key);
  const zone = look.zone || look.id;
  // meetY from terrain ground screen Y only — never sled y
  const meetY = Math.max(H*0.50, Math.min(H*0.78, terrainScreenY!=null ? terrainScreenY : H*0.62));
  const landscape = W > H;
  const farP=0.02;          // far ridge/sky essentially static
  const midP=0.10;          // single distant forest band — one clear rate
  const nearP=1.0;          // near climb props are world-locked (documented rate)
  const snow = look.snow || '#d8e6f0';
  const forest = look.forest || ['#2a4a38','#3d6a4e','#5a8a68'];
  const ms = look.midSnow || [snow, look.shade || '#a8c0d4'];

  // Sky (static — no cam coupling beyond meetY from terrain)
  const sky = look.sky;
  const ug = cx.createLinearGradient(0, 0, 0, meetY);
  if(look.dusk){
    ug.addColorStop(0, sky[0]); ug.addColorStop(0.38, sky[1]); ug.addColorStop(0.75, sky[2]); ug.addColorStop(1, snow);
  } else {
    ug.addColorStop(0, sky[0]); ug.addColorStop(0.5, sky[1]); ug.addColorStop(1, sky[2]);
  }
  cx.fillStyle = ug; cx.fillRect(0, 0, W, H);
  if(look.dusk){
    cx.fillStyle = 'rgba(255,170,110,0.30)';
    cx.beginPath(); cx.arc(W*0.78, H*0.12, 36, 0, Math.PI*2); cx.fill();
    cx.fillStyle = 'rgba(255,220,170,0.50)';
    cx.beginPath(); cx.arc(W*0.78, H*0.12, 13, 0, Math.PI*2); cx.fill();
  }

  // FAR mountain face — essentially static (tiny scroll, no vertical drift)
  const farScroll = camX * farP;
  const farTop = H * (landscape ? 0.14 : 0.18);
  fillBand(-40, W+80, (x)=>ridgeY(x+farScroll, farTop, landscape?22:28, 1.1), meetY, look.far[0]);
  fillBand(-40, W+80, (x)=>ridgeY(x+farScroll, farTop+14, landscape?14:18, 2.3), meetY, look.far[1]);
  const haze1 = cx.createLinearGradient(0, farTop, 0, meetY*0.55);
  haze1.addColorStop(0, rgba(look.fog||[220,230,240], 0.22));
  haze1.addColorStop(0.55, rgba(look.fog||[220,230,240], 0.10));
  haze1.addColorStop(1, rgba(look.fog||[220,230,240], 0));
  cx.fillStyle = haze1; cx.fillRect(0, farTop-8, W, meetY*0.45);

  // ONE distant forest band at midP — snow face + clump forest + trail cuts (+ creek)
  const midScroll = (camX * midP) % 2200;
  const x0 = -midScroll - 80;
  const span = W + 2400;
  const faceTop = meetY - (landscape ? 148 : 178);
  const faceBot = meetY + 6;
  fillBand(x0, span, (x)=>ridgeY(x+midScroll, faceTop, 28, 0.8), faceBot, ms[1]);
  fillBand(x0, span, (x)=>ridgeY(x+midScroll, faceTop+16, 18, 1.9), faceBot, ms[0]);
  const face = cx.createLinearGradient(0, faceTop, 0, faceBot);
  face.addColorStop(0,'rgba(255,255,255,.18)'); face.addColorStop(0.3,'rgba(255,255,255,.05)');
  face.addColorStop(0.7,'rgba(50,80,110,.10)'); face.addColorStop(1,'rgba(50,80,110,.18)');
  cx.fillStyle = face; cx.fillRect(x0, faceTop-8, span, faceBot-faceTop+16);

  const dens = 2;
  const forestBot = faceBot - (zone==='creek' ? 40 : zone==='meadow' ? 8 : 4);
  const trailN = zone==='meadow' ? 1 : (zone==='creek' ? 0 : 2);
  const faceH = forestBot - (faceTop+2);
  const treeTop = faceTop+2 + faceH*0.12;
  const trails = buildTrails(x0 + (zone==='creek'?380:0), treeTop, forestBot, zone, trailN);
  for(let tr=0; tr<trails.length; tr++) drawTrailCut(trails[tr], zone==='meadow'?5.5:5, ms[0], look.shade||'#8aa0b0');
  drawDenseForest(x0, span, faceTop+2, forestBot, forest, look.tint||snow, trails, dens);

  const atmo = cx.createLinearGradient(0, faceTop-14, 0, faceTop+36);
  atmo.addColorStop(0, rgba(look.fog||[220,230,240], 0.28));
  atmo.addColorStop(1, rgba(look.fog||[220,230,240], 0));
  cx.fillStyle = atmo; cx.fillRect(x0, faceTop-16, span, 42);

  if(zone==='creek'){
    const cy = meetY - 24;
    const ice = look.ice || '#b0d4e4';
    const creekY = (x)=> cy + Math.sin((x+midScroll)*0.014)*4.5 + Math.sin((x+midScroll)*0.033)*2.5;
    cx.fillStyle = rgba(hexRgb(snow), 0.7);
    cx.beginPath(); cx.moveTo(-20, cy+14);
    for(let x=-20;x<=W+20;x+=18) cx.lineTo(x, creekY(x)-6);
    for(let x=W+20;x>=-20;x-=18) cx.lineTo(x, creekY(x)-11);
    cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(-20, cy+16);
    for(let x=-20;x<=W+20;x+=18) cx.lineTo(x, creekY(x)+6);
    for(let x=W+20;x>=-20;x-=18) cx.lineTo(x, creekY(x)+11);
    cx.closePath(); cx.fill();
    cx.beginPath();
    for(let x=-20;x<=W+20;x+=14){
      const y=creekY(x), half=3.2+Math.sin((x+midScroll)*0.021)*0.8;
      if(x===-20) cx.moveTo(x,y-half); else cx.lineTo(x,y-half);
    }
    for(let x=W+20;x>=-20;x-=14){
      const y=creekY(x), half=3.2+Math.sin((x+midScroll)*0.021)*0.8;
      cx.lineTo(x,y+half);
    }
    cx.closePath(); cx.fillStyle = ice; cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.40)'; cx.lineWidth = 0.7;
    for(let c=0;c<6;c++){
      const cx0 = 80 + c*130 + hash01(c)*30;
      const cy0 = creekY(cx0);
      cx.beginPath(); cx.moveTo(cx0-2, cy0); cx.lineTo(cx0+8+hash01(c*2)*6, cy0+(hash01(c*7)-0.5)*2.5); cx.stroke();
    }
  }

  // Soft snow veil into the playfield (no near parallax trees — those are world-locked)
  const veilTop = meetY - (landscape ? H*0.08 : H*0.10);
  const veil = cx.createLinearGradient(0, veilTop, 0, meetY + 2);
  veil.addColorStop(0, rgba(hexRgb(snow), 0));
  veil.addColorStop(0.55, rgba(hexRgb(snow), 0.14));
  veil.addColorStop(1, rgba(hexRgb(snow), 0.40));
  cx.fillStyle = veil;
  cx.fillRect(0, veilTop, W, meetY + 2 - veilTop);

  if(typeof window !== 'undefined'){
    window.__BC_PLATE = {
      meetY, landscape, key: look.id, name: look.name, zone,
      farP, midP, nearP, platesDropped: true, veilTop, bdPort: 'b311c69',
      worldLockedNear: true, forestBands: 1
    };
  }
}

/**
 * Pick a seat for a cut shelf: off lips, clear of avoid, first-screen preferred.
 * Natural slope may be steep — cutTracked flattens the pad. Never returns a blocked x.
 */
function findFlatShelf(seedX, halfW, avoid, opts){
  halfW = halfW || 36;
  avoid = avoid || [];
  opts = opts || {};
  const xMax = opts.xMax != null ? opts.xMax : 700;
  const xMin = opts.xMin != null ? opts.xMin : 220;
  let best=null, bestScore=1e9;
  const consider=(x, prefer, lo, hi)=>{
    if(x<lo || x>hi || x>LEVEL_LEN-120) return;
    for(const a of avoid){
      if(Math.abs(x - a.x) < (a.r||90)) return;
    }
    for(let u=-halfW; u<=halfW; u+=6){
      if(onFeatureSpan(x+u, 16)) return; // keep footprint clear of lip pads
    }
    const s=Math.abs(Math.atan2(groundY(x+halfW)-groundY(x-halfW), halfW*2));
    if(s > 0.55) return; // ~30° — too steep even for a cut shelf
    const score=Math.abs(x-prefer)*0.04 + s*8;
    if(score<bestScore){ bestScore=score; best=x; }
  };
  for(let dx=-180; dx<=180; dx+=4) consider(seedX+dx, seedX, xMin, xMax);
  if(best==null){
    for(let x=xMin; x<=xMax; x+=4) consider(x, seedX, xMin, xMax);
  }
  if(best==null){
    // Widen beyond opts before giving up — still never return a colliding x
    for(let x=220; x<=Math.min(LEVEL_LEN-140, 1100); x+=6) consider(x, seedX, 220, 1100);
  }
  return best!=null ? best : 260;
}
function lodgeWallH(sc){ return 26*(sc||1); }
/** Cut a flat shelf into terrain under a footprint; returns seating y (= terrain at cx). */
function seatOnCutShelf(cx, halfW){
  halfW = Math.max(18, halfW||36);
  // Seat y = local terrain at center (never below); flatten pad to that y
  const y = groundY(cx);
  cutTerrainShelf(cx, halfW + 10, y);
  return groundY(cx);
}
/** Record a world landmark whose base must sit on terrain (±2px harness). */
function trackLandmark(kind, x, baseY){
  if(!window.__BC_LANDMARKS) window.__BC_LANDMARKS=[];
  window.__BC_LANDMARKS.push({kind, x, baseY, terrainY:groundY(x)});
}

/**
 * Plan hut/truck/sign shelves BEFORE snow fill so the terrain pad is visible.
 * Positions are WORLD-STABLE (not cam-culled) so groundY doesn't flicker mid-jump.
 */
function planLandmarkShelves(camX){
  const look = settingLook(BG.key);
  const zone = look.zone || look.id;
  const planKey = zone + '|' + levelIdx + '|' + ((S&&S.boulders)?S.boulders.map(b=>b.x|0).join(','):'');
  if(window.__BC_LANDMARK_PLAN && window.__BC_LANDMARK_PLAN._key === planKey){
    // Re-apply the same shelves (cleared elsewhere only on reset)
    clearTerrainShelves();
    for(const sh of (window.__BC_LANDMARK_PLAN._shelves||[])){
      cutTerrainShelf(sh.cx, sh.half, sh.y);
    }
    return window.__BC_LANDMARK_PLAN;
  }
  clearTerrainShelves();
  const rocks=(S.boulders||[]).filter(b=>!b.hit);
  // Hut: modest clearance. Truck/sign: shelf half so pads never swallow rocks.
  const rockAvoidHut=rocks.map(b=>({x:b.x, r:Math.max(72, (b.r||24)*2.2)}));
  const rockAvoidTruck=rocks.map(b=>({x:b.x, r:Math.max(88, (b.r||24)*2.2 + 28)}));
  const pineAvoid=(S.pines||[]).map(pn=>({x:pn.x, r:48}));
  const plan={zone, hut:null, truck:null, sign:null, duskRocks:[], fences:[], _key:planKey, _shelves:[]};

  function cutTracked(cx, half, y){
    cutTerrainShelf(cx, half, y);
    plan._shelves.push({cx, half, y});
    return groundY(cx);
  }
  function planHut(seedX, sc, extraAvoid, shelfOpts){
    sc=sc||1;
    const bw=58*sc, half=bw*0.5;
    const left=findFlatShelf(seedX, half, [...rockAvoidHut, ...pineAvoid, ...(extraAvoid||[])], shelfOpts||{xMax:380});
    const cx=left + half;
    const y0 = groundY(cx);
    // Wide flat pad so the hut reads as seated on a cut shelf, not a slope face
    const gy=cutTracked(cx, half + 18, y0);
    plan.hut={left, cx, gy, sc, bh:lodgeWallH(sc)};
    window.__BC_HUT_X = left;
    return left;
  }

  if(zone==='trailhead'){
    planHut(260, 1.05, null, {xMin:220, xMax:360});
    const avoid=[...rockAvoidTruck, ...pineAvoid, ...(plan.hut ? [{x:plan.hut.cx, r:120}] : [])];
    // Flat road between rocks and first lip (~720)
    const twx=findFlatShelf(640, 40, avoid, {xMin:580, xMax:780});
    const sc=1.35, tcx=twx + 30*sc;
    // Final clearance: truck shelf must not overlap a rock
    const truckClear = !rocks.some(b=>Math.abs(tcx - b.x) < Math.max(90, (b.r||24)*2.5 + 20));
    if(truckClear && twx < 800){
      const ty0=groundY(tcx);
      // Wide road pad covers truck + TRAIL sign
      const tgy=cutTracked(tcx, 70, ty0);
      plan.truck={x:twx, cx:tcx, gy:tgy, sc};
      // Sign on the same cut shelf; prefer past the bed, else behind cab if lip ahead
      let sx=tcx + Math.round(36*sc);
      if(onFeatureSpan(sx, 22) || sx > 800) sx=tcx - Math.round(28*sc);
      plan.sign={x:sx, gy:tgy};
    }
  }
  if(zone==='meadow'){
    for(let sx=158; sx<=980; sx+=72){
      if(onFeatureSpan(sx, 10)) continue;
      if(rockAvoidHut.some(a=>Math.abs(sx-a.x)<(a.r||80))) continue;
      if(pineAvoid.some(a=>Math.abs(sx-a.x)<a.r)) continue;
      if(Math.abs(slopeAt(sx)) > 0.28) continue;
      plan.fences.push({x:sx, gy:groundY(sx)});
    }
    planHut(260, 0.95, null, {xMin:220, xMax:360});
  }
  if(zone==='dusk'){
    // Hut first so décor rocks can't shove it off-camera
    planHut(650, 1.05, null, {xMin:580, xMax:760});
    const used=[];
    const hutAvoid = plan.hut ? [{x:plan.hut.cx, r:100}] : [];
    for(let rb=0; rb<3; rb++){
      const seed=280+rb*120;
      const wx=findFlatShelf(seed, 28, [...rockAvoidHut, ...pineAvoid, ...hutAvoid, ...used.map(x=>({x,r:70}))], {xMin:240, xMax:780});
      if(wx > 780) continue;
      used.push(wx);
      const cx=wx+20;
      const y0=groundY(cx);
      const gy=cutTracked(cx, 28, y0);
      plan.duskRocks.push({wx, cx, gy, rb});
    }
  }
  window.__BC_LANDMARK_PLAN = plan;
  return plan;
}

/** Hut / fence / dusk décor — 1.0× world, using shelves planned earlier this frame. */
function drawWorldLandmarks(camX){
  const look = settingLook(BG.key);
  const plan = window.__BC_LANDMARK_PLAN || planLandmarkShelves(camX);
  if(plan.hut){
    const h=plan.hut;
    drawLodge(h.left, h.gy - h.bh, h.sc, look);
    trackLandmark('hut', h.cx, h.gy);
  }
  if(plan.fences && plan.fences.length){
    cx.strokeStyle='rgba(120,90,60,0.55)'; cx.lineWidth=1.4;
    const vis=plan.fences.filter(f=>f.x>camX-40 && f.x<camX+W+40);
    for(let i=0;i<vis.length;i++){
      const f=vis[i];
      const gy=groundY(f.x);
      cx.beginPath(); cx.moveTo(f.x, gy-12); cx.lineTo(f.x, gy); cx.stroke();
      trackLandmark('fence', f.x, gy);
      if(i+1<vis.length && vis[i+1].x-f.x<80){
        const f2=vis[i+1];
        cx.beginPath(); cx.moveTo(f.x, gy-7); cx.lineTo(f2.x, groundY(f2.x)-7); cx.stroke();
      }
    }
  }
  if(plan.duskRocks){
    for(const dr of plan.duskRocks){
      const gy=groundY(dr.cx);
      cx.fillStyle=look.rock ? look.rock[dr.rb%3] : '#8a8496';
      cx.globalAlpha=0.55;
      cx.beginPath();
      cx.moveTo(dr.wx-8, gy); cx.lineTo(dr.wx+48+dr.rb*3, gy); cx.lineTo(dr.wx+36, gy-10); cx.lineTo(dr.wx-4, gy-7);
      cx.closePath(); cx.fill(); cx.globalAlpha=1;
      trackLandmark('duskRock', dr.cx, gy);
    }
  }
  if(plan.truck){
    const t=plan.truck;
    const tgy=groundY(t.cx);
    drawTruck(t.x, tgy, t.sc);
    trackLandmark('truck', t.cx, tgy);
  }
  if(plan.sign){
    const s=plan.sign;
    const sgy=groundY(s.x);
    cx.fillStyle='#4a3a28'; cx.fillRect(s.x, sgy-42, 3, 42);
    cx.fillStyle='#c8b090'; cx.fillRect(s.x-14, sgy-54, 34, 14);
    cx.fillStyle='#2a2018'; cx.font='700 8px Sora,sans-serif'; cx.textAlign='center';
    cx.fillText('TRAIL', s.x+3, sgy-44);
    trackLandmark('sign', s.x, sgy);
  }
}

function computeCam(p){
  const focusX=W*0.42;
  const camX=p.x-focusX;
  const gy=groundY(p.x);
  const landscape = W > H;
  // Vertical cam locks to TERRAIN only — never follows sled y (no jump vertical drift)
  const gFrac = landscape ? 0.70 : 0.66;
  let targetCamY = gy - H*gFrac;

  const gMin = landscape ? H*0.64 : H*0.58;
  const gMax = landscape ? H*0.78 : H*0.74;
  let gScreen=gy - targetCamY;
  if(gScreen > gMax) targetCamY = gy - gMax;
  if(gScreen < gMin) targetCamY = gy - gMin;

  gScreen=gy - targetCamY;
  if(gScreen > H*0.82) targetCamY = gy - H*0.82;
  const gFloor = landscape ? H*0.58 : H*0.50;
  if(gScreen < gFloor) targetCamY = gy - gFloor;

  if(camSmoothY==null) camSmoothY=targetCamY;
  camSmoothY += (targetCamY - camSmoothY) * (SHOT ? 1 : 0.2);
  lastCam={x:camX, y:camSmoothY, groundScreenY: gy-camSmoothY, sledScreenY:p.y-camSmoothY};
  return lastCam;
}

function drawSnowLipShades(camX, camY){
  for(const [cx0,w,amp] of LIPS){
    if(cx0+w < camX-20 || cx0 > camX+W+20) continue;
    cx.beginPath();
    let first=true;
    for(let t=0;t<=1.001;t+=0.05){
      const x=cx0+t*w;
      const y=groundY(x);
      if(first){cx.moveTo(x,y); first=false;} else cx.lineTo(x,y);
    }
    for(let t=1;t>=0;t-=0.05){
      const x=cx0+t*w;
      const y=groundY(x)+Math.max(4, amp*0.10);
      cx.lineTo(x,y);
    }
    cx.closePath();
    cx.fillStyle='rgba(255,255,255,.07)';
    cx.fill();
  }
}

function draw(){
  if(!S) return;
  const p=S.p;
  let cam=computeCam(p);
  if(SHOT==='rocks' && window.__BC_ROCKS_SHOT){
    const mid=window.__BC_ROCKS_SHOT.mid;
    const camX=mid - W*0.50;
    const gy=groundY(mid);
    const camY=gy - H*0.55;
    camSmoothY=camY;
    cam={x:camX, y:camY, groundScreenY:gy-camY, sledScreenY:p.y-camY};
    lastCam=cam;
  }
  const camX=cam.x, camY=cam.y;

  // Cut flat shelves before snow so hut/truck/sign pads reshape the terrain
  planLandmarkShelves(camX);

  drawBackdrop(camX, cam.groundScreenY);

  cx.save();
  cx.translate(-camX, -camY);

  const x0=camX-40, x1=camX+W+40;
  cx.beginPath();
  cx.moveTo(x0, camY+H+280);
  cx.lineTo(x0, groundY(x0));
  for(let x=x0;x<=x1;x+=5) cx.lineTo(x, groundY(x));
  cx.lineTo(x1, camY+H+280);
  cx.closePath();
  const lookSnow=settingLook(BG.key);
  const sn0=lookSnow.snow||'#d8e6f0';
  const sn1=lookSnow.tint||'#b9cce0';
  const sn2=lookSnow.shade||'#9eb6cc';
  const snowBody=cx.createLinearGradient(0, cam.groundScreenY + camY - 4, 0, camY+H);
  snowBody.addColorStop(0, sn0);
  snowBody.addColorStop(0.55, sn1);
  snowBody.addColorStop(1, sn2);
  cx.fillStyle=snowBody;
  cx.fill();

  cx.beginPath();
  for(let x=x0;x<=x1;x+=5){
    const y=groundY(x);
    if(x===x0) cx.moveTo(x,y); else cx.lineTo(x,y);
  }
  cx.strokeStyle='rgba(255,255,255,.26)';
  cx.lineWidth=2.2;
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.stroke();

  drawSnowLipShades(camX, camY);

  const lookPlace=settingLook(BG.key);
  const pineCap=2;
  let pinesDrawn=0;
  const lookPine=lookPlace;
  const fcols=lookPine.forest||['#2a4a38','#3d6a4e','#5a8a68'];
  const pineSnow=lookPine.snow||'#d8e6f0';
  for(const pn of S.pines){
    if(pn.x<camX-40 || pn.x>camX+W+40) continue;
    if(pinesDrawn>=pineCap) break;
    const gy=groundY(pn.x);
    const th=48*(pn.s||0.95);
    // Seat on terrain with snow mound + contact shadow (not pasted)
    cx.fillStyle='rgba(35,50,65,0.28)';
    cx.beginPath(); cx.ellipse(pn.x+3, gy+4, th*0.28, 4.2, 0.05, 0, Math.PI*2); cx.fill();
    cx.fillStyle=pineSnow;
    cx.beginPath(); cx.ellipse(pn.x, gy+1.5, th*0.34, 6.0, 0, 0, Math.PI*2); cx.fill();
    drawConifer(pn.x, gy+1, th, fcols[2], lookPine.tint||pineSnow, 1);
    pinesDrawn++;
  }
  window.__BC_PINES_VISIBLE = S.pines
    .filter(pn=>pn.x>=camX-40 && pn.x<=camX+W+40)
    .slice(0, pineCap)
    .map(pn=>({x:pn.x, baseY:groundY(pn.x), screenX:pn.x-camX, onFeature:onFeatureSpan(pn.x)}));

  window.__BC_ROCK_BBOX = [];
  for(const b of S.boulders){
    if(b.x<camX-40||b.x>camX+W+40||b.hit) continue;
    drawBoulder(b);
  }

  // Landmarks AFTER rocks so drift snow never buries hut/truck/sign walls
  window.__BC_LANDMARKS = [];
  drawWorldLandmarks(camX);
  if(SHOT){
    assertRockBboxWidth();
    assertRockAboveDrift();
    assertLandmarksSeated();
  }

  if(LEVEL_LEN>camX && LEVEL_LEN<camX+W+80){
    const fx=LEVEL_LEN, fy=groundY(fx);
    cx.fillStyle='#2a2018'; cx.fillRect(fx-4,fy-90,6,90); cx.fillRect(fx+40,fy-90,6,90);
    cx.fillStyle='#f0b429'; cx.fillRect(fx-4,fy-90,50,14);
    cx.fillStyle='#0b1c28'; cx.font='800 11px Syne,sans-serif'; cx.textAlign='center';
    cx.fillText('SUMMIT', fx+22, fy-79);
  }

  const airWobble = (!p.on && p.trick) ? Math.sin(S.t*9)*0.04 : 0;
  blitSled(p.x, p.y, p.ang + airWobble);
  if(S.crashed){
    drawCrashPuff(p);
  } else if(p.on || p.y>groundY(p.x)-8){
    cx.fillStyle='rgba(30,50,70,.18)';
    cx.beginPath(); cx.ellipse(p.x, groundY(p.x)+2, 28, 5, 0, 0, Math.PI*2); cx.fill();
  }

  cx.restore();

  if(S.throtGlow>0.02 && !SHOT){
    const ag=cx.createLinearGradient(0,0,W*0.55,0);
    const a0=0.28*S.throtGlow, a1=0.10*S.throtGlow;
    ag.addColorStop(0,`rgba(94,196,168,${a0})`);
    ag.addColorStop(0.45,`rgba(94,196,168,${a1})`);
    ag.addColorStop(1,'rgba(94,196,168,0)');
    cx.fillStyle=ag;
    cx.fillRect(0,0,W*0.55,H);
  }

  cx.fillStyle='rgba(255,255,255,.40)';
  for(let i=0;i<22;i++){
    const fx=(i*97+S.t*30)%W, fy=(i*53+S.t*40)%(H*0.55);
    cx.fillRect(fx,fy,2,2);
  }

  if(S.landFlash>0){
    cx.fillStyle=`rgba(255,255,255,${S.landFlash*0.18})`;
    cx.fillRect(0,0,W,H);
  }

  drawTrickMeter();
  drawScorePops();
}

function fillRoundRect(x,y,w,h,r){
  const rr=Math.min(r, w/2, h/2);
  cx.beginPath();
  cx.moveTo(x+rr,y);
  cx.arcTo(x+w,y,x+w,y+h,rr);
  cx.arcTo(x+w,y+h,x,y+h,rr);
  cx.arcTo(x,y+h,x,y,rr);
  cx.arcTo(x,y,x+w,y,rr);
  cx.closePath();
  cx.fill();
}

function drawTrickMeter(){
  if(!S||!S.meter.active) return;
  const m=S.meter;
  const h=Math.min(H*0.42, 280);
  const w=Math.max(18, Math.min(28, W*0.055));
  const fsLab=Math.max(14, Math.min(18, W*0.045));
  const x=Math.max(14, W*0.035);
  const y=H*0.20;
  const g=cx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(232,242,246,.22)');
  g.addColorStop(1,'rgba(232,242,246,.34)');
  cx.fillStyle=g;
  fillRoundRect(x, y, w, h, w*0.45);
  const g0=y+h*(1-METER_GREEN[1]), g1=y+h*(1-METER_GREEN[0]);
  cx.fillStyle='rgba(64, 200, 140, 0.55)';
  cx.fillRect(x-2, g0, w+4, Math.max(4, g1-g0));
  const z0=y+h*(1-METER_GOLD[1]), z1=y+h*(1-METER_GOLD[0]);
  cx.fillStyle='rgba(240, 180, 41, 0.85)';
  cx.fillRect(x-3, z0, w+6, Math.max(3, z1-z0));
  const fillH=h*Math.max(0, Math.min(1, m.level));
  const fg=cx.createLinearGradient(0, y+h-fillH, 0, y+h);
  fg.addColorStop(0,'#e8f2f6');
  fg.addColorStop(1,'#5ec4a8');
  cx.fillStyle=fg;
  fillRoundRect(x+2, y+h-fillH, w-4, fillH, (w-4)*0.4);
  const ny=y+h*(1-m.level);
  cx.strokeStyle='#fff';
  cx.lineWidth=2.5;
  cx.beginPath();
  cx.moveTo(x-8, ny); cx.lineTo(x+w+8, ny);
  cx.stroke();
  const labelX=x+w+12;
  cx.textAlign='left';
  cx.shadowColor='rgba(0,0,0,.85)'; cx.shadowBlur=8;
  const perfY=(z0+z1)/2 + fsLab*0.35;             // gold center
  cx.fillStyle='#9aecd0';
  cx.font=`800 ${fsLab}px Syne,Sora,sans-serif`;
  cx.textBaseline='bottom';
  cx.fillText('STICK IT', labelX, y + 2);          // pinned to meter top edge
  cx.textBaseline='alphabetic';
  cx.fillStyle='#f0b429';
  cx.font=`800 ${fsLab}px Syne,Sora,sans-serif`;
  cx.fillText('PERFECT', labelX, perfY);
  cx.shadowBlur=0;
}

function drawOutlinedLabel(text, x, y, fill, sizePx){
  cx.font=`800 ${sizePx}px Syne,Sora,sans-serif`;
  cx.lineJoin='round';
  cx.miterLimit=2;
  cx.fillStyle='#000';
  for(const [blur, oy, a] of [[2,0,0.95],[3,1,0.9],[16,2,0.85]]){
    cx.shadowColor=`rgba(0,0,0,${a})`;
    cx.shadowBlur=blur;
    cx.shadowOffsetX=0;
    cx.shadowOffsetY=oy;
    cx.fillText(text, x, y);
  }
  cx.shadowBlur=0; cx.shadowOffsetY=0;
  cx.lineWidth=Math.max(4.5, sizePx*0.22);
  cx.strokeStyle='rgba(0,0,0,.92)';
  cx.strokeText(text, x, y);
  cx.fillStyle=fill;
  cx.shadowColor='rgba(0,0,0,.75)';
  cx.shadowBlur=10;
  cx.shadowOffsetY=2;
  cx.fillText(text, x, y);
  cx.shadowBlur=0; cx.shadowOffsetY=0;
}

function resultCardBand(){
  const portrait = H >= W;
  return {
    y0: H * (portrait ? 0.18 : 0.25),
    y1: H * (portrait ? 0.24 : 0.32)
  };
}

function hudRects(){
  const live = Math.abs(innerWidth-W)<4 && Math.abs(innerHeight-H)<4;
  if(live){
    const nodes = [
      document.querySelector('#hud .L h1'),
      document.getElementById('sub'),
      document.querySelector('#hud .L'),
      document.querySelector('#hud .R'),
      document.getElementById('hearts')
    ].filter(Boolean);
    return nodes.map(el=>{
      const r=el.getBoundingClientRect();
      return {x:r.left, y:r.top, w:r.width, h:r.height, bottom:r.bottom, right:r.right};
    });
  }
  const top = 10;
  const leftH = H>W ? 78 : 58;
  return [
    {x:12, y:top, w:Math.min(240, W*0.55), h:leftH, bottom:top+leftH, right:12+Math.min(240,W*0.55)},
    {x:W-128, y:top, w:116, h:44, bottom:top+44, right:W-12}
  ];
}

function rectsIntersect(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function drawScorePops(){
  window.__BC_CARD_RECT=null;
  if(!scorePops.length) return;
  const sledY = (lastCam && lastCam.sledScreenY!=null) ? lastCam.sledScreenY : H*0.45;
  const sledX = S && S.p ? (S.p.x - (lastCam ? lastCam.x : 0)) : W*0.5;
  const band = resultCardBand();
  let baseY = (band.y0 + band.y1) * 0.5;
  let baseX = W*0.5;
  const pines = (typeof window!=='undefined' && window.__BC_PINES_VISIBLE) || [];
  const blockers = [
    ...(sledY < band.y1 + 40 ? [{x:sledX, r:W*0.16}] : []),
    ...pines.map(pn=>({x:pn.screenX, r:H>W ? 70 : 100}))
  ];
  const blocked = (x)=>blockers.some(b=>Math.abs(b.x-x)<b.r);
  if(blocked(baseX)){
    const cand=[W*0.62, W*0.38, W*0.70, W*0.30];
    baseX = cand.find(x=>!blocked(x)) || baseX;
  }
  const labSize=Math.max(17, Math.min(22, W*0.052));
  cx.font=`800 ${labSize}px Syne,Sora,sans-serif`;
  const sampleLab=(scorePops[0]&&scorePops[0].lab)||'UNDER-ROTATED';
  const halfW=(cx.measureText(sampleLab).width||120)/2;
  baseX=Math.max(halfW+10, Math.min(W-halfW-10, baseX));
  const hudBottom = Math.max(...hudRects().map(r=>r.bottom), H*0.10);
  baseY = Math.max(band.y0, Math.min(band.y1, baseY));
  if(baseY - labSize < hudBottom + 6) baseY = Math.min(band.y1, hudBottom + 6 + labSize);
  if(sledY < baseY + labSize) baseY = Math.min(band.y1, Math.max(band.y0, sledY - labSize - 8));

  let cardBottom = baseY;
  for(const sp of scorePops){
    const a=Math.min(1, sp.t*1.5);
    cx.save();
    cx.globalAlpha=a;
    cx.textAlign='center';
    cx.textBaseline='alphabetic';
    drawOutlinedLabel(sp.lab, baseX, baseY, sp.perfect?'#f0b429':'#e8f2f6', labSize);
    cardBottom = baseY;
    if(sp.pts!=null){
      const ptsSize=Math.max(15, Math.min(20, W*0.045));
      drawOutlinedLabel('+'+sp.pts, baseX, baseY + labSize + 4, '#5ec4a8', ptsSize);
      cardBottom = baseY + labSize + 4;
    }
    cx.restore();
  }
  const pad = labSize * 0.35;
  window.__BC_CARD_RECT = {
    x: baseX - halfW - pad,
    y: baseY - labSize - pad,
    w: halfW*2 + pad*2,
    h: (cardBottom - (baseY - labSize)) + pad*2,
    baseX, baseY, labSize, band
  };
}

function assertCardClearsHud(){
  const card = window.__BC_CARD_RECT;
  if(!card) return {ok:true, skipped:true};
  const hud = hudRects();
  const hits = hud.filter(r=>rectsIntersect(card, {x:r.x,y:r.y,w:r.w,h:r.h}));
  const band = resultCardBand();
  const inBand = card.baseY >= band.y0 - 1 && card.baseY <= band.y1 + 1;
  return {
    ok: hits.length===0 && inBand,
    hits: hits.length,
    inBand,
    card,
    band,
    hudBottom: Math.max(...hud.map(r=>r.bottom), 0),
    landscape: W>H
  };
}

function visualClearCheck(){
  try{
    const data=cx.getImageData(0,0,cv.width,cv.height).data;
    const ww=cv.width, hh=cv.height;
    let bandHits=0, rows=0;
    for(let yCss=Math.floor(H*0.40); yCss<Math.floor(H*0.92); yCss+=6){
      const y=(yCss*DPR)|0;
      let purp=0, n=0, sumR=0,sumG=0,sumB=0;
      for(let xCss=4; xCss<W-4; xCss+=10){
        const x=(xCss*DPR)|0;
        const i=(y*ww+x)*4;
        const r=data[i], g=data[i+1], b=data[i+2];
        n++; sumR+=r; sumG+=g; sumB+=b;
        const lavender = b>r+18 && b>g+18 && r>70 && r<175 && g>70 && g<160 && b>110 && b<190
          && Math.abs(r-g)<28;
        const darkPurp = r>=35&&r<=85 && g>=28&&g<=70 && b>=75&&b<=140 && b>r+28 && b>g+28;
        if(lavender||darkPurp) purp++;
      }
      if(!n) continue;
      rows++;
      const ar=sumR/n, ag=sumG/n, ab=sumB/n;
      let varSum=0;
      for(let xCss=4; xCss<W-4; xCss+=10){
        const x=(xCss*DPR)|0; const i=(y*ww+x)*4;
        varSum += (data[i]-ar)**2+(data[i+1]-ag)**2+(data[i+2]-ab)**2;
      }
      const variance=varSum/n;
      if(purp/n > 0.45 && variance < 350) bandHits++;
    }
    return {rows, bandHits, ok: bandHits < 3};
  }catch(e){
    return {rows:0, bandHits:0, ok:true, note:String(e)};
  }
}
window.__BC_visualClearCheck=visualClearCheck;

function terrainOnScreenCheck(){
  if(!S) return {ok:false};
  camSmoothY=null;
  const cam=computeCam(S.p);
  const gY=cam.groundScreenY;
  const sY=cam.sledScreenY;
  const ok = gY>=H*0.48 && gY<=H*0.88 && sY>=H*0.10 && sY<=H*0.58 && gY>sY+10;
  return {
    ok, airborne:!S.p.on, groundScreenY:gY, sledScreenY:sY, H, W,
    fracGround:gY/H, fracSled:sY/H
  };
}
window.__BC_terrainOnScreenCheck=terrainOnScreenCheck;

let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(!SHOT) step(dt);
  else syncHud(); // keep HUD honest on frozen shots

function controlsVisibleReport(){
  resize();
  const c=window.__BC_CTRL;
  const pad=2;
  const fully=(b)=>b.visible && b.y>=pad && (b.y+b.h)<=c.H-pad && b.x>=pad && (b.x+b.w)<=c.W-pad;
  const raisedOk = c.trick.bottomClear >= 40;

    trickOk:fully(c.trick), raisedOk, portraitOk,
