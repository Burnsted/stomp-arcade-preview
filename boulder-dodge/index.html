<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Boulder Dodge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#d6e4f0;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button{pointer-events:auto;border:0;cursor:pointer}
#jumpB{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:#e8772e;color:#0b1830;font:800 17px system-ui;box-shadow:0 7px 0 #9a4a12;display:none}
#jumpB:active{transform:translateY(3px);box-shadow:0 4px 0 #9a4a12}
#chrome{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:8px}
#chrome button{width:42px;height:42px;border-radius:10px;background:#14213dcc;color:#eef4fb;border:1px solid #ffffff44;font:700 15px system-ui}
#menuB{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));min-width:74px;height:42px;padding:0 14px;border-radius:10px;background:#14213dcc;color:#9fd3ff;border:1px solid #ffffff44;font:800 13px system-ui;display:none}
#menu{position:fixed;inset:0;z-index:3;display:none;padding:16px;overflow:auto;text-align:center;color:#0b1830;background:linear-gradient(180deg,rgba(255,244,210,.22),rgba(120,180,220,.08) 42%,rgba(255,255,255,0))}
#menu .wrap{max-width:360px;margin:8vh auto 0;padding:22px 18px 18px;border-radius:22px;background:linear-gradient(165deg,rgba(255,255,255,.78),rgba(220,236,248,.58));border:2px solid rgba(255,255,255,.85);box-shadow:0 18px 40px rgba(20,50,80,.22),inset 0 1px 0 #fff}
#menu h1{font:900 34px/1.05 system-ui;letter-spacing:.04em;color:#14213d;text-shadow:0 1px 0 #fff,0 8px 18px rgba(232,119,46,.35)}
#menu .hi{color:#c45e18;font:800 14px system-ui;margin:8px 0 14px}
.playBig{display:block;width:100%;min-height:92px;margin:0 0 10px;border-radius:18px;border:3px solid #fff;background:linear-gradient(180deg,#ff9a3c,#e8772e);color:#fff;font:900 36px system-ui;box-shadow:0 9px 0 #9a4a12,0 14px 28px rgba(232,119,46,.35);text-shadow:0 1px 0 #9a4a12}
.playBig:active{transform:translateY(2px);box-shadow:0 7px 0 #9a4a12}
.sheetNav{display:flex;gap:10px;justify-content:center;margin:10px 0 2px}
.sheetNav button{width:66px;min-height:54px;border-radius:12px;border:1px solid rgba(20,33,61,.18);background:rgba(255,255,255,.72);color:#14213d;font:800 11px system-ui}
.sheetNav .ic{display:block;font-size:18px;margin-bottom:2px}
.tag{opacity:.7;font-size:12px;margin-top:10px;color:#3a5070}
#menu .lvl{opacity:.9;margin:2px 0 4px;font:800 13px system-ui;color:#1e3a5f}
.sheet{text-align:left;max-width:420px;margin:8vh auto 0;background:rgba(11,24,48,.92);border:1px solid #fff3;border-radius:14px;padding:14px;color:#eef6ff}
.sheet h2{font:800 18px system-ui;margin:0 0 8px;color:#fff}
.sheet p,.sheet li{font:500 14px/1.45 system-ui;color:#d5e6f4}
.sheet button.back,.locker button.back{margin-top:14px;padding:8px 10px;border:0;background:none;color:#eef6ff;font:800 14px system-ui;cursor:pointer;text-shadow:0 0 14px rgba(159,211,255,.9),0 1px 3px rgba(0,0,0,.65)}
.locker{max-width:420px;margin:4vh auto 0;padding:16px 14px 18px;color:#eef6ff;background:linear-gradient(165deg,#243a55,#101c2e);border:1px solid #ffffff33;border-radius:16px;text-align:center}
.locker h2{font:900 22px system-ui;color:#fff;margin:0 0 4px}
.locker .meta{font:700 12px system-ui;color:#9fd3ff;margin:0 0 10px}
.locker .stage{margin:0 auto 12px;width:210px;height:160px;border-radius:12px;background:linear-gradient(180deg,#6aa0c8,#d8e8f4 55%,#eef4fa);position:relative;overflow:hidden}
.locker .stage canvas{display:block;width:100%;height:100%}
.locker .sec{font:800 11px system-ui;letter-spacing:.08em;color:#9fd3ff;text-align:left;margin:10px 0 6px;text-transform:uppercase}
.rack,.looks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.rack button,.looks button{background:none;border:0;padding:0;cursor:pointer;width:78px;color:#cfe3f4;font:700 10px/1.25 system-ui;white-space:normal}
.rack button.eq .deck{outline:2px solid #ffd84a;outline-offset:3px}
.looks button.eq .sw{box-shadow:0 0 0 2px #ffd84a}
.rack button.lock,.looks button.lock{opacity:.5}
.rack .deck{width:64px;height:12px;margin:0 auto 6px;border-radius:3px 3px 2px 2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.looks .sw{width:36px;height:36px;margin:0 auto 5px;border-radius:50%;border:2px solid #fff6}
.rack .nm,.looks .nm{display:block;margin:2px auto 0;max-width:74px;line-height:1.2}
.rack .need,.looks .need{display:block;margin:6px auto 0;max-width:74px;color:#ffd84a;font:700 9px/1.25 system-ui}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="chrome"><button type="button" id="mute" aria-label="Mute">♪</button><button type="button" id="pause" aria-label="Pause">❚❚</button></div>
  <button type="button" id="menuB">MENU</button>
  <button type="button" id="jumpB">JUMP</button>
</div>
<div id="menu" role="dialog" aria-modal="true"></div>
<script>
(function(){
'use strict';
var VER='0.9.54-ship-qa';
/* Resort backdrop: 1 dense Alto-face (ship), 2 mid density, 3 extra trail/lodge detail */
var RESORT_STYLE=1;
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
var W=390,H=844,scale=1,OY=0,dpr=1;
var GROUND=268,G=3400,JV=-980,DT=1/120;
var COYOTE=0.09,BUFFER=0.11;
var LIVES_MAX=5,lives=LIVES_MAX;
var GROM_SPD_FRAC=0.60,GROM_HIT=0.80,GROM_CLEAR_PTS=35,GROM_PAD_T=1.2;
var SPIN_HALF=180,SPIN_MAX=720,SPIN_TOL=30;
var SPIN_LIFT=Math.round(Math.abs(JV)*0.18);
var SPIN_RATE=(SPIN_MAX*Math.PI/180)/0.42;
var SPIN_PTS={360:100,540:150,720:300};
var TAP_MS=150,FLIP_RATE=11.2,FLIP_TOL=SPIN_TOL*Math.PI/180;
var FLIP_CRASH_MIN=1.2;
var ROCK_HIT=0.55,ROCK_BURY=0.34;
var APEX_HUD_PAD=36;
var BPM=128,BEAT=60/BPM,SPD=350;
var TER=[1.1,2.4,0.7],RUN_SEED=0;
/* Painted rock variants (1 soft bands, 2 facet, 3 warm rim). Ship best match to slope. */
var ROCK_PAINT=1;
/* Standing rider+board = RIDER_H_FRAC of playfield (~85 CSS @390×844) */
var RIDER_H_FRAC=0.10;
var RIDER_LOCAL_H=94;
var RIDER_ATLAS_H=85;
var ART_CFG={dir:'art/',atlas:'bd-atlas',rig:'bd-rider-rig@1x.webp',rigMeta:'bd-rider-rig.json'};
var ART={ok:false,dpr:1,atlas:null,rig:null,rigMeta:null,bg:{},bgLoading:{}};
var THEME={sky:['#5aa0d0','#9ecce8','#e6f3fb'],snow:'#f4f9fd',shade:'#aec6da',accent:'#e8772e',ink:'#14213d',
  far:'#4a6a88',mid:'#5f82a2',near:'#6f96b4',forest:'#2a4a40',nearSnow:'#d9e6f0'};
var KIT={jacket:'#c4a06a',jacketHi:'#d8bc8e',jacketShade:'#1a1a1e',pants:'#16181c',pantsHi:'#3a3e46',helmet:'#12161c',helmetRim:'#2a3038',goggle:'#1a222c',lens:'#5ec8ff',lensHi:'#d0f4ff',mitten:'#1a1a1e',boot:'#0e1218',skin:'#e8b890',board:'#e8eef4',boardStripe:'#9fd3ff',boardEdge:'#3a4555',rim:'rgba(255,255,255,.45)',outline:'#0e141c'};
/* Man1 ride-frame cutout rig (Terrain Park pipeline) — each layer once */
var RIG_PARTS=['board','thighB','shinB','bootB','armB','torso','thighF','shinF','bootF','armF','head'];
var RIG_DRAW_COUNTS=null; /* fail-test: each part drawn ≤1 per paint */

function fairGap(pad){return Math.round(SPD*(2*Math.abs(JV)/G)+(pad==null?110:pad));}
function beatUnit(){return Math.round(SPD*BEAT);}
/* Compact beat charts: code:beats — t teach,s/m/L rocks,d double,g stagger,c coyote,r grom */
var CHART_SRC={
  ridge:'t:2,s:2,s:2.2,m:2.4,d:3.2,c:2.4,s:2,g:3.2,r:2.6,m:2.2,s:2,m:2.4,c:2.4,s:2,d:3.2,L:2.6,r:2.8,m:2.2',
  field:'s:1.5,s:1.5,m:2,g:2.8,s:1.5,d:3,c:2.2,m:1.8,s:1.5,s:1.5,r:2.4,g:2.8,m:1.8,L:2.4,d:3,s:1.6,c:2.2,m:2',
  lake:'m:2.5,s:2,d:3.5,s:2,m:2.5,g:3.2,c:2.5,r:2.8,L:2.8,d:3.5,s:2,m:2.2,g:3.2,s:2,c:2.4,m:2.5,d:3.5,L:2.8',
  bowl:'s:1,s:1,m:2,g:2.6,s:1,s:1.2,d:2.8,c:2,m:1.5,s:1,r:2.2,L:2.4,g:2.6,s:1,s:1,d:2.8,c:2,m:1.6,s:1.2,L:2.4'
};
var CHART_MAP={t:'teach',s:'rockS',m:'rockM',L:'rockL',d:'double',g:'stagger',c:'coyote',r:'grom'};
function makeChart(src){
  var bu=beatUnit(),x=Math.round(3.2*bu),c=[],i,p,a;
  src=src.split(',');
  for(i=0;i<src.length;i++){p=src[i].split(':');c.push({x:Math.round(x),t:CHART_MAP[p[0]]});x+=bu*parseFloat(p[1]);}
  return{chart:c,len:Math.round(x+bu*1.4)};
}
/* Per-level resort zone + painted palette (no photo plates). forest = [far,mid,near] conifer tones */
var LEVELS=[
  {id:'L1',name:'First Tracks',tag:'Base Lodge',chartKind:'ridge',zone:'base',
    sky:['#7aa8cc','#b0cfe6','#e4f0f8'],snow:'#eef3f8',shade:'#8fa8bc',tint:'#d5e2ec',
    rock:['#5e6a76','#7e8a96','#a4b0bc'],rockRim:'#d7e2ea',
    far:['#a8c0d2','#c4d6e4'],midSnow:['#d8e6f0','#c0d2e0'],
    forest:['#2a4a38','#3d6a4e','#5a8a68'],near:['#3e5e4c','#d6e6f0'],
    light:[-0.55,-0.72],fog:[196,214,226],pt:'fine',flakes:16},
  {id:'L2',name:'Wide White',tag:'Mid Mountain',chartKind:'field',zone:'groomer',
    sky:['#a8c8e8','#d0e4f4','#f2f8fc'],snow:'#fbfcfe',shade:'#c0d4e4',tint:'#eef5fb',
    rock:['#7a8692','#9aa6b0','#c2ccd4'],rockRim:'#f2f7fb',
    far:['#c0d4e4','#dde8f0'],midSnow:['#eef6fb','#d4e4f0'],
    forest:['#355848','#4e7a60','#6a9878'],near:['#4e6e5c','#eaf3f8'],
    light:[-0.12,-0.98],fog:[236,244,250],pt:'big',flakes:28},
  {id:'L3',name:'Glass Run',tag:'Lakeside',chartKind:'lake',zone:'lake',
    sky:['#2a6eaa','#5a9cc8','#b8dcec'],snow:'#d4eef8',shade:'#5e92b0',tint:'#aed4e6',
    rock:['#3e5e72','#5e8296','#8eb0c2'],rockRim:'#c4e8f6',
    far:['#5a8aac','#8eb8d0'],midSnow:['#c8e4f0','#a8cce0'],
    forest:['#1e4034','#2f5e48','#457a60'],near:['#2e5244','#c0dcec'],
    light:[-0.72,-0.5],fog:[140,190,210],pt:'glint',flakes:14},
  {id:'L4',name:'Dusk Bowl',tag:'Summit Light',chartKind:'bowl',zone:'bowl',
    sky:['#5a78a8','#b8a0b0','#e8d8e0'],snow:'#f4f0f6',shade:'#6f87b2',tint:'#cfd6e8',
    rock:['#6a6578','#8a8496','#b0a8b6'],rockRim:'#f2e4ec',
    far:['#7a8098','#b8a8b4'],midSnow:['#e8dce8','#c8c0d0'],
    forest:['#2e3834','#44504a','#5e6a62'],near:['#3e4844','#e0d4e4'],
    light:[0.35,-0.85],fog:[198,200,220],pt:'ember',flakes:22}
];
LEVELS.forEach(function(L){var m=makeChart(CHART_SRC[L.chartKind]);L.chart=m.chart;L.len=m.len;});
var L1_LEN=LEVELS[0].len;
var levelIdx=0;
function curLevel(){return LEVELS[levelIdx%LEVELS.length];}
function curChart(){return curLevel().chart;}
function curLen(){return curLevel().len||L1_LEN;}
function levelLook(){
  var L=curLevel();
  return{snow:L.snow,shade:L.shade,tint:L.tint,light:L.light,flakes:L.flakes,pt:L.pt,
    rock:L.rock,rockRim:L.rockRim,fog:L.fog,tag:L.tag,zone:L.zone,
    far:L.far,midSnow:L.midSnow,forest:L.forest,near:L.near,sky:L.sky};
}

/* Unlockable boards + rider looks (colorways) — earn by clearing levels / stars */
var BOARDS=[
  {id:'stock',name:'Stock',stripe:'#9fd3ff',deck:'#e8eef4',needLvl:0},
  {id:'ember',name:'Ember',stripe:'#e8772e',deck:'#2a1810',needLvl:1},
  {id:'ice',name:'Ice Edge',stripe:'#7ec8ff',deck:'#152030',needLvl:2},
  {id:'gold',name:'Gold Carve',stripe:'#ffd84a',deck:'#2a2410',needLvl:3}
];
var LOOKS=[
  {id:'trail',name:'Trail Tan',jacket:'#c4a06a',needLvl:0},
  {id:'navy',name:'Night Navy',jacket:'#3a5080',needLvl:1},
  {id:'flare',name:'Flare Red',jacket:'#c44a3a',needLvl:2},
  {id:'mint',name:'Mint Run',jacket:'#4a9a78',needStars:3}
];
var unlocks={cleared:0,stars:0,board:'stock',look:'trail'};
try{unlocks=Object.assign(unlocks,JSON.parse(localStorage.getItem('bd9.unlocks')||'{}'));}catch(e){}
function saveUnlocks(){try{localStorage.setItem('bd9.unlocks',JSON.stringify(unlocks))}catch(e){}}
function boardUnlocked(b){return unlocks.cleared>=(b.needLvl||0);}
function lookUnlocked(lk){
  if(lk.needStars!=null)return unlocks.stars>=lk.needStars;
  return unlocks.cleared>=(lk.needLvl||0);
}
function curBoard(){return BOARDS.find(function(b){return b.id===unlocks.board;})||BOARDS[0];}
function curLook(){return LOOKS.find(function(l){return l.id===unlocks.look;})||LOOKS[0];}
function applyEquippedKit(){
  var b=curBoard(),lk=curLook();
  KIT.board=b.deck;KIT.boardStripe=b.stripe;KIT.jacket=lk.jacket;
  KIT.jacketHi=lk.jacket; /* soft match for vector fallback */
}
function grantClear(lvlIdx){
  var next=Math.max(unlocks.cleared,(lvlIdx|0)+1);
  if(next>unlocks.cleared){unlocks.cleared=next;unlocks.stars=(unlocks.stars||0)+1;saveUnlocks();}
  else{unlocks.stars=(unlocks.stars||0)+1;saveUnlocks();}
}

var S,acc=0,last=0,muted=false,menuSheet=null,pb=0,attempts=0,flakes=[];
try{pb=+(localStorage.getItem('bd9.pb')||0)}catch(e){}
try{muted=localStorage.getItem('bd9.mute')==='1'}catch(e){}
try{levelIdx=Math.max(0,Math.min(LEVELS.length-1,+(localStorage.getItem('bd9.lvl')||0)|0))}catch(e){}

function rideX(){return Math.round(Math.max(72,Math.min(W*(isLand()?0.22:0.28),W*(isLand()?0.24:0.30))));}
function isLand(){return W>H*1.15;}
/* Portrait: 10% of viewport height (~85 CSS @844). Landscape: 10% of short side, floor ~45 CSS px. */
function targetRiderCss(){
  if(isLand())return Math.max(45,RIDER_H_FRAC*Math.min(innerWidth,innerHeight));
  return RIDER_H_FRAC*innerHeight;
}
function worldRiderH(){return targetRiderCss()*H/innerHeight;}
function riderSc(){return worldRiderH()/RIDER_LOCAL_H;}
function menuOpen(){var el=document.getElementById('menu');return el&&el.style.display!=='none';}
function hexRgb(hex){
  hex=(hex||'#9ecce8').replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return [parseInt(hex.slice(0,2),16)||158,parseInt(hex.slice(2,4),16)||204,parseInt(hex.slice(4,6),16)||232];
}
function rgba(rgb,a){return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';}
/* game-units per atlas/CSS px — ride = RIDER_H_FRAC × playfield for every sprite */
function artSc(){
  var rh=(ART.ok&&ART.atlas&&ART.atlas.frames.ride)?ART.atlas.frames.ride.h:RIDER_ATLAS_H;
  return worldRiderH()/rh;
}
function artSize(name){
  if(!ART.ok||!ART.atlas||!ART.atlas.frames[name])return null;
  var f=ART.atlas.frames[name],s=artSc();return {f:f,w:f.w*s,h:f.h*s,img:ART.atlas.img};
}
/* Groms: native 1x via artSc, capped at 70% rider H — never upscale past that */
function gromSize(frame){
  if(!ART.ok||!ART.atlas||!ART.atlas.frames[frame])return null;
  var f=ART.atlas.frames[frame],s=artSc(),cap=worldRiderH()*0.70;
  if(f.h*s>cap)s=cap/f.h;
  return {f:f,w:f.w*s,h:f.h*s,img:ART.atlas.img};
}
function drawArt(name,x,gy,opt){
  var a=artSize(name);if(!a)return false;
  opt=opt||{};
  cx.save();cx.translate(x,gy);
  if(opt.spin)cx.rotate(opt.spin);
  if(opt.flip)cx.scale(-1,1);
  cx.drawImage(a.img,a.f.x,a.f.y,a.f.w,a.f.h,-a.w/2,-a.h,a.w,a.h);
  cx.restore();return true;
}
function loadImg(src){
  return new Promise(function(res,rej){var img=new Image();img.onload=function(){res(img);};img.onerror=rej;img.src=src;});
}
function bootArt(){
  var dir=ART_CFG.dir;
  Promise.all([
    fetch(dir+ART_CFG.atlas+'.json').then(function(r){return r.json();}).then(function(meta){
      return loadImg(dir+meta.image).then(function(img){return {img:img,frames:meta.frames,dpr:meta.dpr||1};});
    }),
    loadImg(dir+ART_CFG.rig).catch(function(){return null;}),
    fetch(dir+ART_CFG.rigMeta).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(pack){
    var atlas=pack[0],rig=pack[1],rigMeta=pack[2];
    ART.atlas=atlas;ART.dpr=atlas.dpr||1;
    ART.rig=rig&&rigMeta?rig:null;ART.rigMeta=rig&&rigMeta?rigMeta:null;
    ART.ok=!!atlas;
    if(atlas.frames.ride)RIDER_ATLAS_H=atlas.frames.ride.h;
    if(S)S.obs=buildObs();
  }).catch(function(err){ART.ok=false;console&&console.warn('BD art fallback',err);});
}
/* Plates removed — resort is procedural painted layers (no first-load webp) */
function ensureBackdrop(){return Promise.resolve(null);}
function preloadBackdrop(){}
function setLevel(i){
  levelIdx=((i|0)%LEVELS.length+LEVELS.length)%LEVELS.length;
  try{localStorage.setItem('bd9.lvl',levelIdx)}catch(e){}
}
/* Rolling downhill: world rolls + screen-space pitch so the run reads downhill without camera tilt */
function terr(wx){
  /* Aggressive rollers / dips / pitches — readable at phone size */
  return 96*(0.50*Math.sin(wx/250+TER[0])+0.32*Math.sin(wx/130+TER[1])+0.18*Math.sin(wx/60+TER[2]))
    + 22*Math.sin(wx/420) + 12*Math.sin(wx/88);
}
function gY(sx){
  var wx=(S?S.dist:0)+(sx-rideX());
  return GROUND+terr(wx)+(sx-rideX())*0.28;
}
function slopeAt(sx){return Math.atan2(gY(sx+5)-gY(sx-5),10);}
function ell(x,y,rx,ry,rot){cx.beginPath();cx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function cap(x0,y0,x1,y1,r){var dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;cx.beginPath();cx.moveTo(x0+nx*r,y0+ny*r);cx.arc(x0,y0,r,Math.atan2(ny,nx),Math.atan2(-ny,-nx),false);cx.lineTo(x1-nx*r,y1-ny*r);cx.arc(x1,y1,r,Math.atan2(-ny,-nx),Math.atan2(ny,nx),false);cx.closePath();}

/* Man1 ride-frame cutout rig — Terrain Park joint pipeline */
function poseFor(){
  var p=S.p,t=S.t,sl=slopeAt(p.x),swing=Math.sin(t*5.5);

function gromPadX(){return SPD*GROM_PAD_T;} /* ~1.2s of travel */

function gromTooClose(x,obs){
  /* Avoid boulder clusters, kickers (+ landing), gaps — lone rocks OK */
  var pad=gromPadX(),i,o,rocks=[],pairGap=worldRiderH()*2.2;
  for(i=0;i<obs.length;i++){
    o=obs[i];
    if(o.k==='kicker'){
      if(x>=o.x-pad&&x<=o.x+o.w+pad*1.4)return true;
    }else if(o.k==='gap'){
      if(Math.abs((o.x+o.w/2)-x)<pad)return true;
    }else if(o.k==='rock')rocks.push(o.x);
  }
  rocks.sort(function(a,b){return a-b;});
  for(i=0;i<rocks.length-1;i++){
    if(rocks[i+1]-rocks[i]>pairGap)continue;
    /* grom inside pad of either rock in a tight pair / cluster */
    if(Math.abs(x-rocks[i])<pad||Math.abs(x-rocks[i+1])<pad)return true;
  }
  return false;
}
function rockSize(B,kind,seed){
  /* Irregular sizes/shapes from one atlas frame — S/M/L + seed aspect jitter */
  var s=seed|0,mul=kind==='L'?1.06:kind==='M'?1.0:0.86;

  var B,C,K,sc,gs,gk=gromKindForLevel(),gf=gk==='ride'?'grom_ride':'grom_sit';
  if(ART.ok){
    sc=artSc();

    C={w:ART.atlas.frames.coyote.w*sc,h:ART.atlas.frames.coyote.h*sc};

    gs=gromSize(gf)||{w:0.42*R,h:0.55*R};
  }else{
    B={w:0.90*R,h:0.72*R};C={w:0.75*R,h:0.35*R};K={w:1.4*R,h:0.85*R};gs={w:0.42*R,h:0.55*R};
  }
  var CHART=curChart();
  for(i=0;i<CHART.length;i++){
    e=CHART[i];x=e.x;
    if(e.t==='rockS'||e.t==='teach')pushRock(obs,x,B,'S',i*3+1);
    else if(e.t==='rockM')pushRock(obs,x,B,'M',i*3+2);
    else if(e.t==='rockL')pushRock(obs,x,B,'L',i*3+3);
    else if(e.t==='double'){pushRock(obs,x,B,'S',i);pushRock(obs,x+pair,B,'S',i+1);}
    else if(e.t==='stagger'){pushRock(obs,x,B,'S',i);pushRock(obs,x+fairGap(70),B,'M',i+2);}
    else if(e.t==='roll')pushRock(obs,x,B,'M',i*9); /* legacy chart → static buried rock */
    else if(e.t==='gap')obs.push({k:'gap',x:x,w:1.7*R,h:0.65*R});
    else if(e.t==='kicker'){obs.push({k:'kicker',x:x,w:K.w,h:K.h});pushRock(obs,x+K.w*1.15,B,'M',i*11,{airGate:1});}
    else if(e.t==='coyote')obs.push({k:'coyote',x:x,w:C.w,h:C.h,seed:i,ph:i});

  for(i=0;i<groms.length;i++){

function step(dt){
  if(S.mode!=='play'&&S.mode!=='over')return;
  /* Crash: keep body planted on surface at rider x (no post-crash sink) */
  if(S.mode==='over'){S.crashT=(S.crashT||0)+dt;S.p.y=gY(S.p.x);S.p.vy=0;S.p.on=true;return;}
  S.t+=dt;S.landT=Math.max(0,S.landT-dt);S.pulse=Math.max(0,S.pulse-dt*3);S.nearT=Math.max(0,S.nearT-dt);S.titleT=Math.max(0,(S.titleT||0)-dt);
  if(S.flash<0)S.flash=Math.min(0,S.flash+dt);
  if(S.pop){S.pop.l-=dt;if(S.pop.l<=0)S.pop=null;}
  var p=S.p,gy=gY(p.x);
  if(p.on){S.coyote=COYOTE;p.y=gy;p.vy=0;}
  else{
    S.coyote=Math.max(0,S.coyote-dt);
    /* Full gravity always — jump height is fixed (full JV arc); hold only arms flip */
    p.vy+=G*dt;p.y+=p.vy*dt;

    if(S.pressArmed&&!S.pressFromGround&&(performance.now()-S.pressAt)>=TAP_MS)S.flipHold=true;
    if(S.flipHold)S.flip+=FLIP_RATE*dt;
    /* Advance spin toward target (deg) — rate sized so 720 finishes in a normal hang */
    if(S.spinActive&&S.spinDeg<S.spinTarget){
      S.spinDeg=Math.min(S.spinTarget,S.spinDeg+SPIN_RATE*dt*(180/Math.PI));
    }
    if(p.y>=gy&&p.vy>=0){
      if(!landFromAir())return;
    }
  }
  S.buf=Math.max(0,S.buf-dt);
  S.dist+=SPD*dt;
  /* trail array kept for state shape; orange carve stroke removed */
  for(var i=S.parts.length-1;i>=0;i--){var q=S.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=420*dt;q.l-=dt;if(q.l<=0)S.parts.splice(i,1);}

    var ox=o.x-S.dist+p.x;

    }

        if(S.pressArmed){S.holding=true;S.pressAt=performance.now();S.pressFromGround=true;}
        else S.holding=false;

      }

    }

      var cw=o.w*0.72,ch=Math.max(12,o.h*0.85),cx0=ox+(o.w-cw)/2,topA=gy-ch;
      if(!o.cleared&&ox+o.w<p.x-8){o.cleared=1;S.cleared++;}

      continue;
    }

      var gw=o.w*GROM_HIT,gh=o.h*GROM_HIT,gx0=ox+(o.w-gw)/2,gtop=gy-gh;
      if(!o.cleared&&ox+o.w<p.x-8){

      }

      42+hash01(gi*3)*58,
      20+hash01(gi*7)*32

/* Dress the pale lower slope — fence, drifts, painted trees below the run */
function drawSlopeDressing(){

  var deep=isLand()?56:110; /* portrait needs more fill under the run */
  var rx=rideX();
  /* lower rope / fence line */
  cx.strokeStyle='rgba(110,85,55,.48)';cx.lineWidth=1.5;
  for(i=0;i<16;i++){
    x=-30+i*((W+80)/15);
    y=gY(x)+deep*0.42+Math.sin((x+dist)*0.02)*3;
    cx.beginPath();cx.moveTo(x,y);cx.lineTo(x,y+16);cx.stroke();
    if(i%2===0){cx.beginPath();cx.moveTo(x,y+6);cx.lineTo(x+(W+80)/15,y+6+Math.sin(i)*2);cx.stroke();}
  }
  /* snow drifts on the lower face */
  for(i=0;i<7;i++){
    x=((i*150+dist*0.2)%(W+140))-50;
    y=gY(x)+deep*(0.55+0.08*(i%3))+((i*37)%18);
    drawDrift(x,y,55+((i*13)%34));
  }
  /* painted foreground trees below the run (keep rider lane clear) */
  for(i=0;i<(isLand()?3:5);i++){
    x=((i*210+70+dist*0.15)%(W+180))-60;
    if(x>rx-55&&x<rx+130)continue;
    y=gY(x)+deep*(0.22+0.1*(i%2))+((i*19)%14);
    h=30+((i*17)%20);

  cx.strokeStyle='rgba(255,255,255,.16)';cx.lineWidth=1.2;

    for(x=-40;x<=W+40;x+=14){
      y=gY(x)+deep*(0.72+i*0.06)+Math.sin((x+dist)*0.035+i)*2;

}

function worldBottom(){return Math.max(-OY+H+20,GROUND+240);}
function drawSlopePack(){
  var look=levelLook(),L=look.light,dist=S?S.dist:0,t=S?S.t:0,gx,gy,r;
  cx.beginPath();cx.moveTo(-40,worldBottom());

  cx.fillStyle=sg;cx.fill();

function draw(){

  if(!S){cx.restore();return;}

    else if(o.k==='kicker')drawKicker(ox,gY(ox),o.w,o.h);

  });

  /* plant board onto surface line; light slope tip only (big rotate lifts the deck visually) */

  if(p.on||S.mode==='over')p.y=gY(p.x);
  var plant=(p.on||S.mode==='over')?1.0:0;
  cx.save();cx.translate(p.x,p.y+plant);cx.rotate((p.on||S.mode==='over')?slopeAt(p.x)*0.08:0);

  cx.restore();

function resize(){
  dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  /* Landscape: look-ahead; portrait: frame run lower so belly isn't empty white */
  var landGuess=innerWidth>innerHeight*1.15;
  scale=Math.min(cv.height/(GROUND+(landGuess?210:150)),cv.width/(landGuess?460:340));
  W=cv.width/scale;H=cv.height/scale;
  var land=isLand();
  OY=H*(land?0.56:0.70)-GROUND; /* portrait: run lower so mid+fore fill the frame */
  if(land){if(OY<18)OY=18;}else if(OY<48)OY=48;
  if(S&&S.p){S.p.x=rideX();if(S.p.on)S.p.y=gY(S.p.x);}
}

      return '<button type="button" data-look="'+lk.id+'" class="'+(eq?'eq ':'')+(on?'':'lock')+'"><div class="sw" style="background:'+lk.jacket+'"></div><span class="nm">'+lk.name+'</span>'+(on?'':'<span class="need">'+need+'</span>')+'</button>';
    }).join('');
    el.innerHTML='<div class="locker"><h2>Locker</h2><p class="meta">Stars '+unlocks.stars+' · Cleared '+unlocks.cleared+'</p><div class="stage"><canvas id="lockerCv" width="210" height="160"></canvas></div><div class="sec">Boards</div><div class="rack">'+boards+'</div><div class="sec">Looks</div><div class="looks">'+looks+'</div><button type="button" class="back" id="sheetBack">Back</button></div>';
  }else{
    el.innerHTML='<div class="wrap"><h1>BOULDER DODGE</h1><div class="hi">HIGH SCORE · '+pb+' · ★ '+unlocks.stars+'</div><button type="button" class="playBig" id="playGo">PLAY</button><div class="lvl">'+lv.id+' · '+lv.name+'</div><div class="sheetNav"><button type="button" data-sheet="how"><span class="ic">?</span>How</button><button type="button" data-sheet="levels"><span class="ic">L</span>Levels</button><button type="button" data-sheet="gear"><span class="ic">B</span>Gear</button></div><p class="tag">Offline · v'+VER+'</p></div>';
  }
  if(S&&S.mode==='play'){S.mode='pause';stopMusic();}
  Array.prototype.forEach.call(el.querySelectorAll('[data-board]'),function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute('data-board'),b=BOARDS.find(function(x){return x.id===id;});
      if(b&&boardUnlocked(b)){unlocks.board=b.id;saveUnlocks();applyEquippedKit();openMenu();}
    };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-look]'),function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute('data-look'),lk=LOOKS.find(function(x){return x.id===id;});
      if(lk&&lookUnlocked(lk)){unlocks.look=lk.id;saveUnlocks();applyEquippedKit();openMenu();}
    };
  });
  if(menuSheet==='gear')paintLockerPreview();
}
function paintLockerPreview(){
  var c=document.getElementById('lockerCv');if(!c)return;
  var g=c.getContext('2d'),prev=cx;cx=g;
  g.clearRect(0,0,210,160);
  applyEquippedKit();
  g.save();g.translate(105,138);g.scale(1.35,1.35);
  paintRider({profile:1,cutout:1,lean:0.15,knee:0.55,arch:0.08,boardRot:0.04,frontArm:0.4,backArm:-0.5,armLift:0.2},0);
  g.restore();cx=prev;
}
function closeMenu(){document.getElementById('menu').style.display='none';menuSheet=null;if(S&&S.mode==='pause'){S.mode='play';startMusic();}}
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;var d=Math.min(.05,(ts-last)/1000);last=ts;
  tickMusic(ts);
  if(S&&(S.mode==='play'||S.mode==='over')){acc+=d;while(acc>=DT){step(DT);acc-=DT;}} else acc=0;
  try{draw();}catch(err){console&&console.warn(err);}
}

function canvasPress(e){
  e.preventDefault();ensureAC();
  if(S.mode==='ready'){S.mode='play';startMusic();syncUI();beginPress();return;}
  if(S.mode==='clear'){setLevel(levelIdx+1);attempts=0;reset(false);S.mode='play';startMusic();syncUI();return;}
  if(S.mode==='pause'){S.mode='play';startMusic();return;}
  beginPress();
}
/* Press/release gate: ≤TAP_MS air release = spin tap; longer hold = flip */
function beginPress(){
  if(S.mode!=='play')return;
  S.pressAt=performance.now();
  S.pressArmed=true;
  S.flipHold=false;
  if(S.p.on||S.coyote>0){
    S.pressFromGround=true;
    jump();
  }else{
    S.pressFromGround=false;
    S.holding=true; /* may become flip after TAP_MS; never a spin until short release */
  }
}
function canvasRelease(){
  if(!S||S.mode!=='play'){if(S)holdSet(false);return;}
  if(!S.pressArmed){holdSet(false);return;}
  var dur=performance.now()-S.pressAt;
  var fromGround=S.pressFromGround;
  S.pressArmed=false;
  S.pressFromGround=false;
  /* Spins only from short air taps — holds never count as taps */
  if(!fromGround&&!S.p.on&&dur<=TAP_MS)spinTap();
  holdSet(false);
}
cv.addEventListener('pointerdown',canvasPress);cv.addEventListener('pointerup',canvasRelease);cv.addEventListener('pointercancel',canvasRelease);
document.getElementById('jumpB').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();canvasPress(e);});
document.getElementById('jumpB').addEventListener('pointerup',canvasRelease);
document.getElementById('menuB').onclick=function(){openMenu();};
document.getElementById('pause').onclick=function(){if(!S)return;if(S.mode==='play'){S.mode='pause';stopMusic();}else if(S.mode==='pause'){S.mode='play';startMusic();}syncUI();};
document.getElementById('mute').onclick=function(){muted=!muted;try{localStorage.setItem('bd9.mute',muted?'1':'0')}catch(e){}if(muted)stopMusic();else if(S&&S.mode==='play')startMusic();syncUI();};
document.getElementById('menu').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='playGo'){closeMenu();lives=LIVES_MAX;attempts++;reset(true);S.mode='play';startMusic();syncUI();return;}
  if(b.id==='sheetBack'){menuSheet=null;openMenu();return;}
  if(b.dataset.sheet){menuSheet=b.dataset.sheet;openMenu();}
});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)canvasPress(e);}});
addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp')canvasRelease();});
addEventListener('resize',resize);addEventListener('orientationchange',function(){setTimeout(resize,50);});

window.BoulderDodge={
  version:VER,
  startLevel:function(i){
    if(typeof i==='number')setLevel(i);
    closeMenu();lives=LIVES_MAX;attempts++;reset(true);S.mode='play';startMusic();syncUI();
  },
  start:function(){if(S.mode==='ready'){S.mode='play';startMusic();syncUI();}},
  openMenu:openMenu,getState:function(){return S.mode;},getScore:score,getLives:function(){return lives;},
  _test:{
    state:function(){return S;},step:step,jump:jump,spinTap:spinTap,beginPress:beginPress,canvasRelease:canvasRelease,
    holdSet:holdSet,draw:draw,reset:reset,crash:crash,buildObs:buildObs,gromSize:gromSize,fairGap:fairGap,setSeed:setSeed,
    setLevel:setLevel,curLevel:curLevel,LEVELS:LEVELS,ensureBackdrop:ensureBackdrop,gY:gY,slopeAt:slopeAt,terr:terr,pineBlocked:pineBlocked,drawWorldPines:drawWorldPines,poseFor:poseFor,paintRider:paintRider,paintRiderCutout:paintRiderCutout,riderProfileMetrics:riderProfileMetrics,measureRigPixels:measureRigPixels,rigLayout:rigLayout,cutoutSc:cutoutSc,RIG_PARTS:RIG_PARTS,getRigDrawCounts:function(){return RIG_DRAW_COUNTS;},getRigMeta:function(){return ART.rigMeta;},
    setLevelPlate:function(i,bg,sky){var lv=LEVELS[((i|0)%LEVELS.length+LEVELS.length)%LEVELS.length];if(sky)lv.sky=sky;},
    clearSpin:clearSpin,clearFlip:clearFlip,clearTricks:clearTricks,
    spinLandingClean:spinLandingClean,flipLandingClean:flipLandingClean,spinTier:spinTier,landFromAir:landFromAir,
    getLives:function(){return lives;},setLives:function(n){lives=Math.max(0,Math.min(LIVES_MAX,n|0));},
    consts:{DT:DT,SPD:SPD,L1_LEN:L1_LEN,RIDER_H_FRAC:RIDER_H_FRAC,RIDER_LOCAL_H:RIDER_LOCAL_H,JV:JV,G:G,
      SPIN_HALF:SPIN_HALF,SPIN_MAX:SPIN_MAX,SPIN_TOL:SPIN_TOL,SPIN_LIFT:SPIN_LIFT,SPIN_RATE:SPIN_RATE,SPIN_PTS:SPIN_PTS,
      TAP_MS:TAP_MS,FLIP_RATE:FLIP_RATE,FLIP_TOL:FLIP_TOL,FLIP_CRASH_MIN:FLIP_CRASH_MIN,APEX_HUD_PAD:APEX_HUD_PAD,
      ROCK_HIT:ROCK_HIT,ROCK_BURY:ROCK_BURY,BEAT:BEAT,BPM:BPM,
      LIVES_MAX:LIVES_MAX,GROM_SPD_FRAC:GROM_SPD_FRAC,GROM_HIT:GROM_HIT,GROM_CLEAR_PTS:GROM_CLEAR_PTS,GROM_PAD_T:GROM_PAD_T},
    apexFloorY:apexFloorY,clampApex:clampApex,curLen:curLen,curChart:curChart,levelLook:levelLook,
    getRockPaint:function(){return ROCK_PAINT;},
    setRockPaint:function(n){ROCK_PAINT=Math.max(1,Math.min(3,n|0));},
    getResortStyle:function(){return RESORT_STYLE;},
    setResortStyle:function(n){RESORT_STYLE=Math.max(1,Math.min(3,n|0));},
    getUnlocks:function(){return unlocks;},
    setUnlocks:function(u){unlocks=Object.assign(unlocks,u||{});saveUnlocks();applyEquippedKit();},
    BOARDS:BOARDS,LOOKS:LOOKS,curBoard:curBoard,curLook:curLook,
    /* Assert full apex + clean landing for N consecutive jumps on current level (no rocks). */
    runJumpArcTest:function(n){
      n=n||20;
      var expected=(JV*JV)/(2*G),out=[],i,ok=true;
      var prevMode=S.mode,prevObs=S.obs;
      S.mode='play';S.obs=[];S.fail='';lives=LIVES_MAX;
      for(i=0;i<n;i++){
        var k;
        for(k=0;k<24;k++)step(DT);
        if(!S.p.on){while(!S.p.on)step(DT);}
        var takeoffGy=gY(S.p.x);
        beginPress(); /* hold through apex — release never cuts height anyway */
        var minY=S.p.y,frames=0,floorHit=false,landed=false;
        while(frames++<700){
          step(DT);
          if(S.p.y<minY)minY=S.p.y;
          if(S.p.y<=apexFloorY()+0.5)floorHit=true;
          if(S.mode==='over')break;
          if(S.p.on&&frames>4){landed=true;break;}
        }
        canvasRelease();
        for(k=0;k<8;k++)step(DT);
        var height=takeoffGy-minY,ratio=height/expected;
        var pass=landed&&!floorHit&&S.mode==='play'&&ratio>=0.92&&height>=expected*0.92;
        if(!pass)ok=false;
        out.push({n:i+1,height:+height.toFixed(2),expected:+expected.toFixed(2),ratio:+ratio.toFixed(3),
          apexFloorHit:floorHit,landed:landed,fail:S.fail||'',pass:pass});
        if(S.mode==='over'){S.mode='play';S.fail='';S.p.on=true;S.p.y=gY(S.p.x);S.p.vy=0;}
      }
      S.obs=prevObs;S.mode=prevMode;
      return{ok:ok,expected:expected,jumps:out,level:curLevel().id,apexFloorY:apexFloorY()};
    },
    measureRider:function(){
      var playCss=innerHeight,riderCss=targetRiderCss();
      return{
        riderHFrac:RIDER_H_FRAC,
        riderLocalH:RIDER_LOCAL_H,
        riderSc:riderSc(),
        artSc:artSc(),
        artOk:!!ART.ok,
        bgOk:true,
        bgFile:'procedural-resort',
        resortStyle:RESORT_STYLE,
        level:curLevel().id,
        worldRiderH:worldRiderH(),
        playfieldGameH:H,
        playfieldCssPx:playCss,
        riderCssPx:riderCss,
        riderPxOverPlayfieldPx:riderCss/playCss,
        orientation:isLand()?'landscape':'portrait'
      };
    }
  }
};

resize();reset(false);openMenu();
bootArt();
requestAnimationFrame(frame);
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if((r.scope||'').indexOf('/arcade/boulder-dodge')>=0)r.unregister();});});}catch(e){}
})();
</script>
