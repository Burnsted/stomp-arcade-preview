<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#7EC8E3"/>
  <meta name="description" content="Haven's Garden — pick flowers, plant, catch butterflies, color, and help the bees."/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet"/>
  <title>Haven's Garden</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #8fd4f0; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none;
      position: fixed; inset: 0;
      font-family: Fredoka, system-ui, sans-serif;
    }
    canvas { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
    #live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #ver {
      position: fixed; right: 10px; bottom: 6px; z-index: 2;
      font-size: 11px; color: rgba(61,52,40,0.55); pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Haven's Garden"></canvas>
  <div id="live" aria-live="polite"></div>
  <div id="ver">v0.1.12-grokbuild-improved</div>
  <script src="js/garden.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('game');
      const live = document.getElementById('live');
      window.HavensGarden = Garden.start(canvas, (t) => { if (live) live.textContent = t; });
      if (navigator.serviceWorker && typeof navigator.serviceWorker.register === 'function') {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
